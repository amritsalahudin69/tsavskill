<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Retro Anime Station Static Layout</title>
    <style>
      :root {
        color-scheme: light;
        background: #d7d2c7;
        font-family: system-ui, sans-serif;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #d7d2c7;
      }

      canvas {
        display: block;
        width: min(96vw, 960px);
        height: auto;
        background: #d9c5a5;
      }
    </style>
  </head>
  <body>
    <canvas id="scene" width="960" height="600" aria-label="Retro anime static station layout preview"></canvas>

    <script>
      const canvas = document.getElementById('scene');
      const ctx = canvas.getContext('2d');
      const W = canvas.width;
      const H = canvas.height;

      function fillRoundedRect(x, y, w, h, r, fill, stroke) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + w - r, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + r);
        ctx.lineTo(x + w, y + h - r);
        ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        ctx.lineTo(x + r, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - r);
        ctx.lineTo(x, y + r);
        ctx.quadraticCurveTo(x, y, x + r, y);
        ctx.closePath();
        ctx.fillStyle = fill;
        ctx.fill();
        if (stroke) {
          ctx.strokeStyle = stroke;
          ctx.lineWidth = 2;
          ctx.stroke();
        }
      }

      function drawBackground() {
        const sky = ctx.createLinearGradient(0, 0, 0, 320);
        sky.addColorStop(0, '#7ea7c9');
        sky.addColorStop(0.42, '#d4c7a9');
        sky.addColorStop(1, '#e9b278');
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, W, H);

        const sunGlow = ctx.createRadialGradient(220, 110, 12, 220, 110, 170);
        sunGlow.addColorStop(0, 'rgba(255, 236, 168, 0.95)');
        sunGlow.addColorStop(1, 'rgba(255, 236, 168, 0)');
        ctx.fillStyle = sunGlow;
        ctx.fillRect(80, 20, 300, 220);

        ctx.fillStyle = '#7a8b7d';
        ctx.beginPath();
        ctx.moveTo(0, 260);
        ctx.lineTo(120, 226);
        ctx.lineTo(242, 232);
        ctx.lineTo(360, 212);
        ctx.lineTo(510, 226);
        ctx.lineTo(640, 218);
        ctx.lineTo(784, 236);
        ctx.lineTo(W, 228);
        ctx.lineTo(W, 320);
        ctx.lineTo(0, 320);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#9aa67d';
        ctx.beginPath();
        ctx.moveTo(0, 320);
        ctx.lineTo(120, 292);
        ctx.lineTo(246, 298);
        ctx.lineTo(390, 284);
        ctx.lineTo(560, 300);
        ctx.lineTo(700, 286);
        ctx.lineTo(W, 304);
        ctx.lineTo(W, 360);
        ctx.lineTo(0, 360);
        ctx.closePath();
        ctx.fill();
      }

      function drawPlatform() {
        const horizon = 260;
        const nearY = 520;
        const farLeft = 80;
        const farRight = 760;
        const nearLeft = 98;
        const nearRight = 930;

        ctx.fillStyle = '#c4b7a5';
        ctx.beginPath();
        ctx.moveTo(farLeft, horizon + 50);
        ctx.lineTo(farRight, horizon + 10);
        ctx.lineTo(nearRight, nearY);
        ctx.lineTo(nearLeft, nearY);
        ctx.closePath();
        ctx.fill();

        ctx.strokeStyle = '#6a635f';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(farLeft, horizon + 50);
        ctx.lineTo(farRight, horizon + 10);
        ctx.lineTo(nearRight, nearY);
        ctx.lineTo(nearLeft, nearY);
        ctx.closePath();
        ctx.stroke();

        ctx.fillStyle = '#8a7d73';
        ctx.beginPath();
        ctx.moveTo(120, 412);
        ctx.lineTo(200, 386);
        ctx.lineTo(600, 358);
        ctx.lineTo(742, 392);
        ctx.lineTo(742, 418);
        ctx.lineTo(120, 442);
        ctx.closePath();
        ctx.fill();

        ctx.strokeStyle = '#584d45';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(120, 412);
        ctx.lineTo(200, 386);
        ctx.lineTo(600, 358);
        ctx.lineTo(742, 392);
        ctx.lineTo(742, 418);
        ctx.lineTo(120, 442);
        ctx.closePath();
        ctx.stroke();
      }

      function drawRails() {
        const railY1 = 310;
        const railY2 = 520;
        const left1 = 220;
        const right1 = 830;
        const left2 = 140;
        const right2 = 922;

        ctx.strokeStyle = '#3b3d46';
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.moveTo(left1, railY1);
        ctx.lineTo(right1, railY2);
        ctx.moveTo(left2, railY1 + 22);
        ctx.lineTo(right2, railY2 + 18);
        ctx.stroke();

        ctx.strokeStyle = '#7e7a6d';
        ctx.lineWidth = 3;
        for (let i = 0; i < 12; i += 1) {
          const x1 = 220 + i * 48;
          const x2 = 140 + i * 58;
          ctx.beginPath();
          ctx.moveTo(x1, railY1 + 2);
          ctx.lineTo(x2 + 18, railY2 + 2);
          ctx.stroke();
        }
      }

      function drawStationBuilding() {
        ctx.fillStyle = '#d9c7a4';
        ctx.beginPath();
        ctx.moveTo(520, 292);
        ctx.lineTo(762, 280);
        ctx.lineTo(810, 418);
        ctx.lineTo(544, 430);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#947a65';
        ctx.beginPath();
        ctx.moveTo(548, 300);
        ctx.lineTo(744, 290);
        ctx.lineTo(744, 330);
        ctx.lineTo(548, 340);
        ctx.closePath();
        ctx.fill();

        const windows = [560, 592, 624, 656, 688, 720];
        ctx.fillStyle = '#d8e0c3';
        windows.forEach((x) => {
          ctx.fillRect(x, 332, 20, 54);
        });

        ctx.strokeStyle = '#544d47';
        ctx.lineWidth = 2;
        ctx.strokeRect(548, 300, 196, 64);
        ctx.strokeRect(552, 332, 190, 58);
      }

      function drawBench() {
        ctx.fillStyle = '#8d6757';
        ctx.fillRect(632, 404, 82, 12);
        ctx.fillRect(638, 416, 12, 40);
        ctx.fillRect(702, 416, 12, 40);
        ctx.fillStyle = '#bdad92';
        ctx.fillRect(642, 410, 60, 8);
      }

      function drawSuitcase(x, y) {
        ctx.save();
        ctx.translate(x, y);
        ctx.fillStyle = '#a75a45';
        fillRoundedRect(-24, -10, 48, 28, 6, '#a75a45', '#4a2f2c');
        ctx.fillStyle = '#d9b885';
        ctx.fillRect(-8, -6, 18, 10);
        ctx.fillStyle = '#5c4338';
        ctx.fillRect(-18, 10, 36, 3);
        ctx.restore();
      }

      function drawTraveler() {
        const x = 472;
        const y = 450;

        ctx.save();
        ctx.translate(x, y);

        ctx.strokeStyle = '#2c2a2d';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(-16, 40);
        ctx.lineTo(-8, 112);
        ctx.moveTo(18, 40);
        ctx.lineTo(8, 118);
        ctx.moveTo(-12, 68);
        ctx.lineTo(-46, 94);
        ctx.moveTo(18, 68);
        ctx.lineTo(52, 94);
        ctx.stroke();

        ctx.fillStyle = '#d8b68a';
        ctx.beginPath();
        ctx.arc(0, -18, 26, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#2b2d32';
        ctx.beginPath();
        ctx.moveTo(-18, -38);
        ctx.lineTo(0, -56);
        ctx.lineTo(18, -38);
        ctx.lineTo(12, -8);
        ctx.lineTo(-12, -8);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#0a0d14';
        ctx.beginPath();
        ctx.arc(-8, -18, 3.1, 0, Math.PI * 2);
        ctx.arc(8, -18, 3.1, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = '#1f2128';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-4, -8);
        ctx.quadraticCurveTo(0, -2, 4, -8);
        ctx.stroke();

        ctx.fillStyle = '#e0b38b';
        ctx.beginPath();
        ctx.moveTo(-6, -4);
        ctx.lineTo(6, -4);
        ctx.lineTo(10, 10);
        ctx.lineTo(-10, 10);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#8d3d39';
        ctx.fillRect(-36, 8, 72, 64);
        ctx.fillStyle = '#ce4d40';
        ctx.fillRect(-30, 18, 60, 42);

        ctx.fillStyle = '#e2d8bb';
        ctx.fillRect(-8, 22, 16, 10);

        ctx.strokeStyle = '#2a292d';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-18, 108);
        ctx.lineTo(-8, 148);
        ctx.moveTo(18, 108);
        ctx.lineTo(10, 146);
        ctx.stroke();

        ctx.fillStyle = '#d3a77a';
        ctx.fillRect(-18, 148, 24, 10);
        ctx.fillRect(0, 146, 24, 10);

        ctx.restore();

        ctx.save();
        ctx.translate(520, 428);
        ctx.rotate(-0.2);
        ctx.fillStyle = '#8e99b8';
        ctx.fillRect(-12, -8, 18, 18);
        ctx.restore();

        drawSuitcase(522, 438);
      }

      function drawTrain() {
        ctx.save();

        ctx.fillStyle = '#cf5c49';
        ctx.beginPath();
        ctx.moveTo(650, 276);
        ctx.lineTo(830, 252);
        ctx.lineTo(886, 318);
        ctx.lineTo(700, 340);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#d9c3a5';
        ctx.beginPath();
        ctx.moveTo(638, 284);
        ctx.lineTo(888, 318);
        ctx.lineTo(888, 452);
        ctx.lineTo(638, 420);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#ac4a3d';
        ctx.beginPath();
        ctx.moveTo(680, 300);
        ctx.lineTo(824, 286);
        ctx.lineTo(824, 348);
        ctx.lineTo(680, 360);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#e1d4ad';
        ctx.fillRect(696, 332, 52, 24);
        ctx.fillRect(756, 330, 52, 24);
        ctx.fillRect(692, 374, 26, 16);
        ctx.fillRect(724, 374, 26, 16);
        ctx.fillRect(756, 374, 26, 16);
        ctx.fillRect(788, 374, 26, 16);

        ctx.strokeStyle = '#4f2e2d';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(700, 300);
        ctx.lineTo(880, 320);
        ctx.lineTo(880, 452);
        ctx.lineTo(700, 420);
        ctx.closePath();
        ctx.stroke();

        ctx.fillStyle = '#3c3e4a';
        for (let i = 0; i < 4; i += 1) {
          const px = 714 + i * 52;
          ctx.beginPath();
          ctx.arc(px, 448, 8, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.strokeStyle = '#53596d';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(662, 426);
        ctx.lineTo(880, 456);
        ctx.stroke();

        ctx.restore();
      }

      function renderScene() {
        ctx.clearRect(0, 0, W, H);
        drawBackground();
        drawPlatform();
        drawRails();
        drawStationBuilding();
        drawBench();
        drawTraveler();
        drawTrain();
      }

      renderScene();
    </script>
  </body>
</html>
