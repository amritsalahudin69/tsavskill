<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Low-Poly Mountain Cable Car</title>
    <style>
      :root {
        color-scheme: light;
        background: #dfeaf4;
        font-family: system-ui, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #dfeaf4;
      }

      #app {
        width: 100vw;
        height: 100vh;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="app" aria-label="Low-poly mountain cable car animation"></div>

    <script type="module">
      import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js";

      const app = document.getElementById("app");
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0xcfe5f4);

      const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 600);
      camera.position.set(0, 40, 100);
      camera.lookAt(0, 18, 0);

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFShadowMap;
      app.appendChild(renderer.domElement);

      const hemiLight = new THREE.HemisphereLight(0xeaf7ff, 0x2d4734, 1.2);
      scene.add(hemiLight);

      const sunLight = new THREE.DirectionalLight(0xfff0d1, 1.5);
      sunLight.position.set(40, 46, 18);
      sunLight.castShadow = true;
      sunLight.shadow.mapSize.set(2048, 2048);
      sunLight.shadow.camera.left = -90;
      sunLight.shadow.camera.right = 90;
      sunLight.shadow.camera.top = 90;
      sunLight.shadow.camera.bottom = -90;
      scene.add(sunLight);

      const terrainMaterial = new THREE.MeshStandardMaterial({ color: 0x5d7c5d, flatShading: true, roughness: 0.96, metalness: 0.02 });
      const stationMaterial = new THREE.MeshStandardMaterial({ color: 0x7c6a5b, flatShading: true, roughness: 1 });
      const roofMaterial = new THREE.MeshStandardMaterial({ color: 0x9d4d3d, flatShading: true, roughness: 0.95 });
      const cableMaterial = new THREE.MeshStandardMaterial({ color: 0x8b8f93, flatShading: true, metalness: 0.2, roughness: 0.9 });
      const cabinMaterial = new THREE.MeshStandardMaterial({ color: 0xc4a672, flatShading: true, roughness: 0.9 });
      const glassMaterial = new THREE.MeshStandardMaterial({ color: 0x9fd2ea, emissive: 0x15486a, flatShading: true, transparent: true, opacity: 0.92 });
      const doorMaterial = new THREE.MeshStandardMaterial({ color: 0x8d5a47, flatShading: true, roughness: 1 });
      const towerMaterial = new THREE.MeshStandardMaterial({ color: 0x6b7d74, flatShading: true, roughness: 1 });
      const trimMaterial = new THREE.MeshStandardMaterial({ color: 0x493f36, flatShading: true, roughness: 1 });
      const cabinRoofMaterial = new THREE.MeshStandardMaterial({ color: 0xc16e4b, flatShading: true, roughness: 0.95 });
      const stationDoorOffset = 6.1;
      const cabinHalfLength = 4.25;
      const stationPlatformTop = 1.2;
      const cabinFloorTopOffset = 6.65;

      function terrainHeightAt(x, z) {
        const baseHeight = 12 * Math.sin(x * 0.12) + 8 * Math.cos(z * 0.18) + 6 * Math.sin((x + z) * 0.09) + 2;
        const distanceToUpperStation = Math.hypot(x - 34, z + 10);
        const plateauBlend = Math.min(1, Math.max(0, (21 - distanceToUpperStation) / 9));
        const smoothBlend = plateauBlend * plateauBlend * (3 - 2 * plateauBlend);
        return baseHeight + (14 - baseHeight) * smoothBlend;
      }

      function makeTerrain() {
        const terrainGeometry = new THREE.PlaneGeometry(180, 120, 44, 32);
        terrainGeometry.rotateX(-Math.PI / 2);
        const positions = terrainGeometry.attributes.position;

        for (let i = 0; i < positions.count; i += 1) {
          const x = positions.getX(i);
          const z = positions.getZ(i);
          const y = terrainHeightAt(x, z);
          positions.setY(i, y);
        }

        terrainGeometry.computeVertexNormals();
        const terrain = new THREE.Mesh(terrainGeometry, terrainMaterial);
        terrain.receiveShadow = true;
        return terrain;
      }

      function addTrees() {
        const treePositions = [
          [-28, -22], [-18, -12], [-12, 18], [12, -24], [26, 20], [44, 22], [-34, 30], [18, 35], [52, 8], [60, -20]
        ];

        treePositions.forEach(([x, z]) => {
          const group = new THREE.Group();
          const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 1.1, 6, 5), new THREE.MeshStandardMaterial({ color: 0x5d4033, flatShading: true }));
          trunk.position.y = 3;
          trunk.castShadow = true;
          trunk.receiveShadow = true;
          group.add(trunk);

          const crownMaterial = new THREE.MeshStandardMaterial({ color: 0x2d5c43, flatShading: true });
          const crown1 = new THREE.Mesh(new THREE.ConeGeometry(3.6, 8, 6), crownMaterial);
          crown1.position.y = 8.5;
          crown1.castShadow = true;
          group.add(crown1);

          const crown2 = new THREE.Mesh(new THREE.ConeGeometry(2.9, 7, 6), crownMaterial);
          crown2.position.y = 12.5;
          crown2.castShadow = true;
          group.add(crown2);

          const baseY = terrainHeightAt(x, z);
          group.position.set(x, baseY, z);
          scene.add(group);
        });
      }

      function makeGableRoof(width, depth, eaveY, ridgeY, material) {
        const halfWidth = width * 0.5;
        const rise = ridgeY - eaveY;
        const slopeLength = Math.hypot(halfWidth, rise);
        const angle = Math.atan2(rise, halfWidth);
        const roof = new THREE.Group();
        const leftPanel = new THREE.Mesh(new THREE.BoxGeometry(slopeLength, 0.45, depth), material);
        leftPanel.position.set(-halfWidth * 0.5, (eaveY + ridgeY) * 0.5, 0);
        leftPanel.rotation.z = angle;
        leftPanel.castShadow = true;
        roof.add(leftPanel);

        const rightPanel = new THREE.Mesh(new THREE.BoxGeometry(slopeLength, 0.45, depth), material);
        rightPanel.position.set(halfWidth * 0.5, (eaveY + ridgeY) * 0.5, 0);
        rightPanel.rotation.z = -angle;
        rightPanel.castShadow = true;
        roof.add(rightPanel);
        return roof;
      }

      function makeStation(position, rotationY) {
        const group = new THREE.Group();
        group.position.copy(position);
        group.rotation.y = rotationY;

        const frontWallDepth = 0.5;
        const stationDepth = 12;
        const mainBodyDepth = stationDoorOffset + stationDepth * 0.5 - frontWallDepth;
        const mainBody = new THREE.Mesh(new THREE.BoxGeometry(18, 6, mainBodyDepth), stationMaterial);
        mainBody.position.set(0, 3, (-stationDepth * 0.5 + stationDoorOffset - frontWallDepth) * 0.5);
        mainBody.castShadow = true;
        mainBody.receiveShadow = true;
        group.add(mainBody);

        const doorwayWidth = 6.4;
        const frontSectionWidth = (18 - doorwayWidth) * 0.5;
        for (const side of [-1, 1]) {
          const wallSection = new THREE.Mesh(new THREE.BoxGeometry(frontSectionWidth, 6, frontWallDepth), stationMaterial);
          wallSection.position.set(side * (doorwayWidth * 0.5 + frontSectionWidth * 0.5), 3, stationDoorOffset - frontWallDepth * 0.5);
          wallSection.castShadow = true;
          wallSection.receiveShadow = true;
          group.add(wallSection);
        }
        const doorwayHeader = new THREE.Mesh(new THREE.BoxGeometry(doorwayWidth, 1.2, frontWallDepth), stationMaterial);
        doorwayHeader.position.set(0, 5.4, stationDoorOffset - frontWallDepth * 0.5);
        doorwayHeader.castShadow = true;
        group.add(doorwayHeader);

        const roof = makeGableRoof(18, 15.5, 6, 7, roofMaterial);
        roof.castShadow = true;
        group.add(roof);

        const gableShape = new THREE.Shape();
        gableShape.moveTo(-9, 6);
        gableShape.lineTo(9, 6);
        gableShape.lineTo(0, 7);
        gableShape.closePath();
        const gableGeometry = new THREE.ShapeGeometry(gableShape);
        const frontGable = new THREE.Mesh(gableGeometry, stationMaterial);
        frontGable.position.z = 6.01;
        frontGable.castShadow = true;
        group.add(frontGable);
        const rearGable = new THREE.Mesh(gableGeometry, stationMaterial);
        rearGable.position.z = -6.01;
        rearGable.rotation.y = Math.PI;
        rearGable.castShadow = true;
        group.add(rearGable);

        const entrance = new THREE.Mesh(new THREE.BoxGeometry(6.1, 4.7, 0.06), doorMaterial);
        entrance.position.set(0, 3.55, stationDoorOffset - frontWallDepth - 0.02);
        entrance.castShadow = true;
        group.add(entrance);

        for (const x of [-7, -4.6, 4.6, 7]) {
          const windowFrame = new THREE.Mesh(new THREE.BoxGeometry(2.35, 2.35, 0.35), trimMaterial);
          windowFrame.position.set(x, 3.6, stationDoorOffset);
          group.add(windowFrame);
          const windowPane = new THREE.Mesh(new THREE.BoxGeometry(1.95, 1.95, 0.4), glassMaterial);
          windowPane.position.set(x, 3.6, stationDoorOffset + 0.21);
          windowPane.castShadow = true;
          group.add(windowPane);
        }

        for (const side of [-1, 1]) {
          for (const z of [-3, 0, 3]) {
            const windowFrame = new THREE.Mesh(new THREE.BoxGeometry(0.35, 2.35, 2.35), trimMaterial);
            windowFrame.position.set(side * 9.01, 3.6, z);
            group.add(windowFrame);
            const windowPane = new THREE.Mesh(new THREE.BoxGeometry(0.4, 1.95, 1.95), glassMaterial);
            windowPane.position.set(side * 9.21, 3.6, z);
            windowPane.castShadow = true;
            group.add(windowPane);
          }
        }

        const platform = new THREE.Mesh(new THREE.BoxGeometry(22, stationPlatformTop, 30), new THREE.MeshStandardMaterial({ color: 0x9d977e, flatShading: true }));
        platform.position.y = stationPlatformTop * 0.5;
        platform.receiveShadow = true;
        group.add(platform);

        group.updateMatrixWorld(true);
        for (const x of [-10, 10]) {
          for (const z of [-14, 14]) {
            const footWorld = group.localToWorld(new THREE.Vector3(x, 0, z));
            const footY = terrainHeightAt(footWorld.x, footWorld.z);
            const pierHeight = position.y - footY;
            if (pierHeight > 0.5) {
              const pier = new THREE.Mesh(new THREE.BoxGeometry(0.7, pierHeight, 0.7), towerMaterial);
              pier.position.set(x, (footY - position.y + pierHeight * 0.5), z);
              pier.castShadow = true;
              pier.receiveShadow = true;
              group.add(pier);
            }
          }
        }

        scene.add(group);
        return group;
      }

      function addBrace(tower, start, end, radius) {
        const direction = end.clone().sub(start);
        const brace = new THREE.Mesh(
          new THREE.CylinderGeometry(radius * 0.8, radius, direction.length(), 5),
          towerMaterial
        );
        brace.position.copy(start).add(end).multiplyScalar(0.5);
        brace.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction.normalize());
        brace.castShadow = true;
        brace.receiveShadow = true;
        tower.add(brace);
      }

      function makeSupportTower(contactPoint, tangent) {
        const tower = new THREE.Group();
        tower.position.set(contactPoint.x, terrainHeightAt(contactPoint.x, contactPoint.z), contactPoint.z);
        tower.rotation.y = Math.atan2(tangent.x, tangent.z);
        scene.add(tower);
        tower.updateMatrixWorld(true);

        const cableAnchor = tower.worldToLocal(contactPoint.clone());
        const crossBar = new THREE.Mesh(new THREE.BoxGeometry(10, 0.55, 0.9), towerMaterial);
        crossBar.position.set(0, cableAnchor.y - 0.5, 0);
        crossBar.castShadow = true;
        crossBar.receiveShadow = true;
        tower.add(crossBar);

        for (const side of [-1, 1]) {
          const footWorld = tower.localToWorld(new THREE.Vector3(side * 5.2, 0, 0));
          const foot = new THREE.Vector3(side * 5.2, terrainHeightAt(footWorld.x, footWorld.z) - tower.position.y, 0);
          const shoulder = new THREE.Vector3(side * 4, cableAnchor.y - 0.35, 0);
          addBrace(tower, foot, shoulder, 0.65);

          const footing = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.7, 2.2), towerMaterial);
          footing.position.copy(foot);
          footing.y += 0.35;
          footing.castShadow = true;
          footing.receiveShadow = true;
          tower.add(footing);
        }

        const saddle = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.35, 1.4), cableMaterial);
        saddle.position.set(0, cableAnchor.y - 0.02, 0);
        saddle.castShadow = true;
        tower.add(saddle);
        return tower;
      }

      function makeCableCar() {
        const cabinRig = new THREE.Group();

        const bogieMaterial = new THREE.MeshStandardMaterial({ color: 0x555f63, flatShading: true, metalness: 0.15, roughness: 0.85 });
        for (const z of [-0.75, 0.75]) {
          const roller = new THREE.Mesh(new THREE.CylinderGeometry(0.48, 0.48, 1.4, 8), bogieMaterial);
          roller.rotation.z = Math.PI / 2;
          roller.position.set(0, -0.05, z);
          roller.castShadow = true;
          cabinRig.add(roller);
        }

        const hanger = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.34, 1.9, 6), bogieMaterial);
        hanger.position.y = -1.22;
        hanger.castShadow = true;
        cabinRig.add(hanger);

        const body = new THREE.Mesh(new THREE.BoxGeometry(5.6, 4.2, cabinHalfLength * 2), cabinMaterial);
        body.position.y = -4.95;
        body.castShadow = true;
        body.receiveShadow = true;
        cabinRig.add(body);

        const roof = makeGableRoof(6.4, cabinHalfLength * 2 + 0.6, -2.8, -1.9, cabinRoofMaterial);
        cabinRig.add(roof);

        for (const end of [-1, 1]) {
          const frontZ = end * (cabinHalfLength + 0.07);
          for (const x of [-1.75, 1.75]) {
            const windowFrame = new THREE.Mesh(new THREE.BoxGeometry(1.6, 1.9, 0.24), trimMaterial);
            windowFrame.position.set(x, -4.55, frontZ);
            cabinRig.add(windowFrame);
            const windowPane = new THREE.Mesh(new THREE.BoxGeometry(1.3, 1.6, 0.12), glassMaterial);
            windowPane.position.set(x, -4.55, frontZ + end * 0.16);
            windowPane.castShadow = true;
            cabinRig.add(windowPane);
          }

          const doorFrame = new THREE.Mesh(new THREE.BoxGeometry(1.85, 3.35, 0.25), trimMaterial);
          doorFrame.position.set(0, -5.05, frontZ);
          cabinRig.add(doorFrame);
          const door = new THREE.Mesh(new THREE.BoxGeometry(1.55, 3.05, 0.12), doorMaterial);
          door.position.set(0, -5.05, frontZ + end * 0.16);
          door.castShadow = true;
          cabinRig.add(door);
        }

        for (const side of [-1, 1]) {
          for (const z of [-2.5, 0, 2.5]) {
            const windowFrame = new THREE.Mesh(new THREE.BoxGeometry(0.24, 1.75, 1.55), trimMaterial);
            windowFrame.position.set(side * 2.83, -4.55, z);
            cabinRig.add(windowFrame);
            const windowPane = new THREE.Mesh(new THREE.BoxGeometry(0.12, 1.45, 1.25), glassMaterial);
            windowPane.position.set(side * 2.99, -4.55, z);
            windowPane.castShadow = true;
            cabinRig.add(windowPane);
          }
        }

        const floor = new THREE.Mesh(new THREE.BoxGeometry(5.2, 0.4, 8.1), new THREE.MeshStandardMaterial({ color: 0x7a6a56, flatShading: true }));
        floor.position.y = -cabinFloorTopOffset - 0.2;
        floor.castShadow = true;
        floor.receiveShadow = true;
        cabinRig.add(floor);

        return cabinRig;
      }

      function easeInOutCubic(value) {
        return value < 0.5 ? 4 * value * value * value : 1 - Math.pow(-2 * value + 2, 3) / 2;
      }

      const terrain = makeTerrain();
      scene.add(terrain);
      addTrees();

      const lowerStationPosition = new THREE.Vector3(-38, terrainHeightAt(-38, 12) + 0.3, 12);
      const upperStationPosition = new THREE.Vector3(34, terrainHeightAt(34, -10) + 0.3, -10);
      const lowerStationYaw = 1.81;
      const upperStationYaw = Math.atan2(12, -1);
      makeStation(lowerStationPosition, lowerStationYaw);
      makeStation(upperStationPosition, upperStationYaw);
      const terminalDockOffset = stationDoorOffset + cabinHalfLength;
      const terminalCableHeight = stationPlatformTop + cabinFloorTopOffset;
      const lowerDockAnchor = lowerStationPosition.clone().add(new THREE.Vector3(Math.sin(lowerStationYaw) * terminalDockOffset, terminalCableHeight, Math.cos(lowerStationYaw) * terminalDockOffset));
      const upperDockAnchor = upperStationPosition.clone().add(new THREE.Vector3(Math.sin(upperStationYaw) * terminalDockOffset, terminalCableHeight, Math.cos(upperStationYaw) * terminalDockOffset));

      const cableControlPoints = [
        lowerDockAnchor,
        new THREE.Vector3(-22, 21, 8),
        new THREE.Vector3(-6, 24, 2),
        new THREE.Vector3(12, 32, -5),
        new THREE.Vector3(28, 33, -10),
        upperDockAnchor
      ];
      const cableCurve = new THREE.CatmullRomCurve3(cableControlPoints);
      const cableGeometry = new THREE.TubeGeometry(cableCurve, 220, 0.5, 6, false);
      const cableMesh = new THREE.Mesh(cableGeometry, cableMaterial);
      cableMesh.receiveShadow = true;
      scene.add(cableMesh);

      const towerPositions = [0.18, 0.38, 0.58, 0.78];
      towerPositions.forEach((t) => {
        const pos = cableCurve.getPointAt(t);
        makeSupportTower(pos, cableCurve.getTangentAt(t).normalize());
      });

      const cabinRig = makeCableCar();
      scene.add(cabinRig);

      function updateCabin(elapsed) {
        const duration = 10;
        const travel = Math.min(1, Math.max(0, elapsed / duration));
        const eased = easeInOutCubic(travel);
        const point = cableCurve.getPointAt(eased);
        const tangent = cableCurve.getTangentAt(eased).normalize();
        const yaw = Math.atan2(tangent.x, tangent.z);

        cabinRig.position.copy(point);
        cabinRig.rotation.set(0, yaw, 0);
      }

      let animationStartTime = null;
      function renderFrame(time) {
        if (animationStartTime === null) {
          animationStartTime = time;
        }
        const elapsed = Math.min(10.5, Math.max(0, (time - animationStartTime) * 0.001));
        updateCabin(elapsed);
        renderer.render(scene, camera);
        requestAnimationFrame(renderFrame);
      }

      function onResize() {
        const { innerWidth, innerHeight } = window;
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
      }

      window.addEventListener("resize", onResize);
      requestAnimationFrame(renderFrame);
    </script>
  </body>
</html>
