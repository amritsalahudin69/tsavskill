<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Low-Poly Mountain Cable Car</title>
    <style>
      :root {
        color-scheme: light;
        background: #dfeaf4;
        font-family: system-ui, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #dfeaf4;
      }

      #app {
        width: 100vw;
        height: 100vh;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="app" aria-label="Low-poly mountain cable car animation"></div>

    <script type="module">
      import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js";

      const app = document.getElementById("app");
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0xcfe5f4);

      const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 600);
      camera.position.set(0, 24, 92);
      camera.lookAt(0, 18, 0);

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFShadowMap;
      app.appendChild(renderer.domElement);

      const hemiLight = new THREE.HemisphereLight(0xeaf7ff, 0x2d4734, 1.2);
      scene.add(hemiLight);

      const sunLight = new THREE.DirectionalLight(0xfff0d1, 1.5);
      sunLight.position.set(40, 46, 18);
      sunLight.castShadow = true;
      sunLight.shadow.mapSize.set(2048, 2048);
      sunLight.shadow.camera.left = -90;
      sunLight.shadow.camera.right = 90;
      sunLight.shadow.camera.top = 90;
      sunLight.shadow.camera.bottom = -90;
      scene.add(sunLight);

      const terrainMaterial = new THREE.MeshStandardMaterial({ color: 0x5d7c5d, flatShading: true, roughness: 0.96, metalness: 0.02 });
      const stationMaterial = new THREE.MeshStandardMaterial({ color: 0x7c6a5b, flatShading: true, roughness: 1 });
      const roofMaterial = new THREE.MeshStandardMaterial({ color: 0x9d4d3d, flatShading: true, roughness: 0.95 });
      const cableMaterial = new THREE.MeshStandardMaterial({ color: 0x8b8f93, flatShading: true, metalness: 0.2, roughness: 0.9 });
      const cabinMaterial = new THREE.MeshStandardMaterial({ color: 0xc4a672, flatShading: true, roughness: 0.9 });
      const glassMaterial = new THREE.MeshStandardMaterial({ color: 0x9fd2ea, emissive: 0x15486a, flatShading: true, transparent: true, opacity: 0.92 });
      const doorMaterial = new THREE.MeshStandardMaterial({ color: 0x8d5a47, flatShading: true, roughness: 1 });
      const towerMaterial = new THREE.MeshStandardMaterial({ color: 0x6b7d74, flatShading: true, roughness: 1 });

      function terrainHeightAt(x, z) {
        const ridge = 12 * Math.sin(x * 0.12) + 8 * Math.cos(z * 0.18);
        const valley = 6 * Math.sin((x + z) * 0.09);
        return ridge + valley + 2;
      }

      function makeTerrain() {
        const terrainGeometry = new THREE.PlaneGeometry(180, 120, 44, 32);
        terrainGeometry.rotateX(-Math.PI / 2);
        const positions = terrainGeometry.attributes.position;

        for (let i = 0; i < positions.count; i += 1) {
          const x = positions.getX(i);
          const z = positions.getZ(i);
          const y = terrainHeightAt(x, z);
          positions.setY(i, y);
        }

        terrainGeometry.computeVertexNormals();
        const terrain = new THREE.Mesh(terrainGeometry, terrainMaterial);
        terrain.receiveShadow = true;
        return terrain;
      }

      function addTrees() {
        const treePositions = [
          [-28, -22], [-18, -12], [-12, 18], [12, -24], [26, 20], [36, -8], [44, 22], [-42, 16], [-34, 30], [18, 35], [52, 8], [60, -20]
        ];

        treePositions.forEach(([x, z]) => {
          const group = new THREE.Group();
          const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 1.1, 6, 5), new THREE.MeshStandardMaterial({ color: 0x5d4033, flatShading: true }));
          trunk.position.y = 3;
          trunk.castShadow = true;
          trunk.receiveShadow = true;
          group.add(trunk);

          const crownMaterial = new THREE.MeshStandardMaterial({ color: 0x2d5c43, flatShading: true });
          const crown1 = new THREE.Mesh(new THREE.ConeGeometry(3.6, 8, 6), crownMaterial);
          crown1.position.y = 8.5;
          crown1.castShadow = true;
          group.add(crown1);

          const crown2 = new THREE.Mesh(new THREE.ConeGeometry(2.9, 7, 6), crownMaterial);
          crown2.position.y = 12.5;
          crown2.castShadow = true;
          group.add(crown2);

          const baseY = terrainHeightAt(x, z);
          group.position.set(x, baseY, z);
          scene.add(group);
        });
      }

      function makeStation(position, rotationY = 0, heightOffset = 0) {
        const group = new THREE.Group();
        const base = new THREE.Mesh(new THREE.BoxGeometry(18, 6, 12), stationMaterial);
        base.position.y = 3 + heightOffset;
        base.castShadow = true;
        base.receiveShadow = true;
        group.add(base);

        const roof = new THREE.Mesh(new THREE.ConeGeometry(11, 7, 4), roofMaterial);
        roof.rotation.y = Math.PI / 4;
        roof.position.y = 9 + heightOffset;
        roof.castShadow = true;
        group.add(roof);

        const entrance = new THREE.Mesh(new THREE.BoxGeometry(3.8, 4.4, 1.6), doorMaterial);
        entrance.position.set(0, 2.2 + heightOffset, 6.1);
        entrance.castShadow = true;
        group.add(entrance);

        for (let i = -2; i <= 2; i += 1) {
          const windowPane = new THREE.Mesh(new THREE.BoxGeometry(2.1, 2.1, 0.5), glassMaterial);
          windowPane.position.set(i * 3.2, 3.6 + heightOffset, 6.2);
          windowPane.castShadow = true;
          group.add(windowPane);
        }

        const platform = new THREE.Mesh(new THREE.BoxGeometry(22, 1.2, 18), new THREE.MeshStandardMaterial({ color: 0x9d977e, flatShading: true }));
        platform.position.set(0, 0.6 + heightOffset, 0);
        platform.receiveShadow = true;
        group.add(platform);

        group.position.copy(position);
        group.rotation.y = rotationY;
        scene.add(group);
        return group;
      }

      function makeSupportTower(x, z, height) {
        const tower = new THREE.Group();
        const mast = new THREE.Mesh(new THREE.CylinderGeometry(0.9, 1.2, height, 6), towerMaterial);
        mast.position.y = height * 0.5;
        mast.castShadow = true;
        mast.receiveShadow = true;
        tower.add(mast);

        const crossBar = new THREE.Mesh(new THREE.BoxGeometry(8.5, 0.8, 0.8), towerMaterial);
        crossBar.position.y = height - 1.4;
        crossBar.castShadow = true;
        tower.add(crossBar);

        const anchor = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.2, 1.2), towerMaterial);
        anchor.position.y = height - 0.8;
        tower.add(anchor);

        tower.position.set(x, terrainHeightAt(x, z), z);
        scene.add(tower);
        return tower;
      }

      function makeCableCar() {
        const cabinRig = new THREE.Group();

        const hanger = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.8, 2.2, 6), new THREE.MeshStandardMaterial({ color: 0x8a9097, flatShading: true }));
        hanger.rotation.z = Math.PI / 2;
        hanger.position.y = -1.2;
        hanger.castShadow = true;
        cabinRig.add(hanger);

        const body = new THREE.Mesh(new THREE.BoxGeometry(9, 4.5, 5.6), cabinMaterial);
        body.position.y = -5.5;
        body.castShadow = true;
        body.receiveShadow = true;
        cabinRig.add(body);

        const roof = new THREE.Mesh(new THREE.ConeGeometry(4.8, 3.4, 4), new THREE.MeshStandardMaterial({ color: 0xc16e4b, flatShading: true }));
        roof.rotation.z = Math.PI;
        roof.position.y = -2.8;
        roof.castShadow = true;
        cabinRig.add(roof);

        for (let i = -2; i <= 2; i += 1) {
          const windowPane = new THREE.Mesh(new THREE.BoxGeometry(1.4, 1.7, 0.3), glassMaterial);
          windowPane.position.set(i * 2.2, -5.4, 2.9);
          windowPane.castShadow = true;
          cabinRig.add(windowPane);
        }

        const door = new THREE.Mesh(new THREE.BoxGeometry(2.1, 3.2, 0.4), doorMaterial);
        door.position.set(0, -5.4, 2.9);
        door.castShadow = true;
        cabinRig.add(door);

        const floor = new THREE.Mesh(new THREE.BoxGeometry(8.2, 0.4, 5), new THREE.MeshStandardMaterial({ color: 0x7a6a56, flatShading: true }));
        floor.position.y = -7.7;
        floor.castShadow = true;
        floor.receiveShadow = true;
        cabinRig.add(floor);

        return cabinRig;
      }

      function easeInOutCubic(value) {
        return value < 0.5 ? 4 * value * value * value : 1 - Math.pow(-2 * value + 2, 3) / 2;
      }

      const terrain = makeTerrain();
      scene.add(terrain);
      addTrees();

      const lowerStationPosition = new THREE.Vector3(-38, terrainHeightAt(-38, 12) + 0.3, 12);
      const upperStationPosition = new THREE.Vector3(34, terrainHeightAt(34, -10) + 0.8, -10);
      makeStation(lowerStationPosition, 0.1, 0);
      makeStation(upperStationPosition, 0.1, 0);

      const cableControlPoints = [
        new THREE.Vector3(-40, 18, 16),
        new THREE.Vector3(-22, 21, 8),
        new THREE.Vector3(-6, 24, 2),
        new THREE.Vector3(12, 29, -5),
        new THREE.Vector3(28, 33, -10),
        new THREE.Vector3(40, 34, -12)
      ];
      const cableCurve = new THREE.CatmullRomCurve3(cableControlPoints);
      const cableGeometry = new THREE.TubeGeometry(cableCurve, 220, 0.5, 6, false);
      const cableMesh = new THREE.Mesh(cableGeometry, cableMaterial);
      cableMesh.receiveShadow = true;
      scene.add(cableMesh);

      const towerPositions = [0.18, 0.38, 0.58, 0.78];
      towerPositions.forEach((t) => {
        const pos = cableCurve.getPointAt(t);
        const tower = makeSupportTower(pos.x, pos.z, 16 + t * 8);
        const cableAnchor = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.6, 1.1), towerMaterial);
        cableAnchor.position.set(pos.x, pos.y + 0.8, pos.z);
        tower.add(cableAnchor);
      });

      const cabinRig = makeCableCar();
      scene.add(cabinRig);

      const shadowPlane = new THREE.Mesh(
        new THREE.CircleGeometry(10, 16),
        new THREE.MeshBasicMaterial({ color: 0x2d3f2d, transparent: true, opacity: 0.32 })
      );
      shadowPlane.rotation.x = -Math.PI / 2;
      shadowPlane.position.y = terrainHeightAt(0, 0) + 0.15;
      scene.add(shadowPlane);

      function updateCabin(elapsed) {
        const duration = 10;
        const travel = Math.min(1, Math.max(0, elapsed / duration));
        const eased = easeInOutCubic(travel);
        const point = cableCurve.getPointAt(eased);
        const tangent = cableCurve.getTangentAt(eased).normalize();
        const yaw = Math.atan2(tangent.x, tangent.z);

        cabinRig.position.copy(point);
        cabinRig.position.y += 2.6;
        cabinRig.rotation.set(0, yaw + Math.PI / 2, 0);
        cabinRig.rotation.z = Math.sin(elapsed * 2.2) * 0.08;

        shadowPlane.position.x = point.x;
        shadowPlane.position.z = point.z;
      }

      function renderFrame(time) {
        const elapsed = Math.min(10.5, time * 0.001);
        updateCabin(elapsed);
        renderer.render(scene, camera);
        requestAnimationFrame(renderFrame);
      }

      function onResize() {
        const { innerWidth, innerHeight } = window;
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
      }

      window.addEventListener("resize", onResize);
      requestAnimationFrame(renderFrame);
    </script>
  </body>
</html>
