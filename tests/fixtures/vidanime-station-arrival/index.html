<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Retro Anime Station Arrival</title>
  <style>
    :root {
      color-scheme: light;
      background: #d7d3c8;
      font-family: system-ui, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: #d7d3c8;
    }

    main {
      width: min(96vw, 960px);
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 8 / 5;
      border: 4px solid #554f4b;
      background: #e8c99a;
    }

    #init-error {
      margin: 0;
      padding: 0.75rem;
      color: #fff;
      background: #8b2f36;
    }

    #init-error[hidden] {
      display: none;
    }
  </style>
</head>
<body>
  <main>
    <canvas id="scene" width="960" height="600" role="img"
      aria-label="A traveler with a suitcase walks across a railway platform, stops by a bench, and looks toward an approaching train.">
      Canvas 2D is required to display this scene.
    </canvas>
    <p id="init-error" role="alert" hidden></p>
  </main>
  <script>
    "use strict";

    const canvas = document.getElementById("scene");
    const errorPanel = document.getElementById("init-error");
    const ctx = canvas.getContext("2d");
    const WIDTH = 960;
    const HEIGHT = 600;
    const WALK_DURATION = 6.2;
    const DURATION = 11.5;
    const HORIZON_Y = 262;
    const TRACK_VANISH_X = 744;
    const TRACK_VANISH_Y = 262;
    const TRACK_SLOPE = 0.76;
    const PLATFORM_FAR_X = 572;
    const PLATFORM_NEAR_X = 926;
    const PLATFORM_LEFT_X = 28;
    const TRAIN_START_Y = 322;
    const TRAIN_END_Y = 510;
    const WALK_START = { x: 160, y: 502 };
    const WALK_STOP = { x: 470, y: 418 };
    const BENCH = { x: 560, y: 434 };

    if (!ctx) {
      errorPanel.textContent = "Canvas 2D could not be initialized in this browser.";
      errorPanel.hidden = false;
    } else {
      const grainPattern = makeGrainPattern();

      function makeGrainPattern() {
        const grainCanvas = document.createElement("canvas");
        grainCanvas.width = 96;
        grainCanvas.height = 96;
        const grainContext = grainCanvas.getContext("2d");
        let seed = 251;
        const random = () => {
          seed = (seed * 16807) % 2147483647;
          return (seed - 1) / 2147483646;
        };
        for (let index = 0; index < 170; index += 1) {
          const x = random() * grainCanvas.width;
          const y = random() * grainCanvas.height;
          grainContext.fillStyle = index % 2 ? "rgba(44, 41, 38, 0.12)" : "rgba(255, 234, 179, 0.18)";
          grainContext.fillRect(x, y, 0.8 + random() * 1.2, 0.8 + random() * 1.2);
        }
        return ctx.createPattern(grainCanvas, "repeat");
      }

      function inkShape(makePath, fill, stroke = "#2d2a2c", lineWidth = 2) {
        ctx.save();
        makePath();
        ctx.fillStyle = fill;
        ctx.fill();
        ctx.lineWidth = lineWidth;
        ctx.lineJoin = "round";
        ctx.lineCap = "round";
        ctx.strokeStyle = stroke;
        ctx.stroke();
        ctx.restore();
      }

      function inkLine(makePath, color, width = 2) {
        ctx.save();
        ctx.beginPath();
        makePath();
        ctx.strokeStyle = "#2f2d2d";
        ctx.lineWidth = width + 1.5;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.stroke();
        ctx.strokeStyle = color;
        ctx.lineWidth = width;
        ctx.stroke();
        ctx.restore();
      }

      function smoothstep(value) {
        const t = Math.max(0, Math.min(1, value));
        return t * t * (3 - 2 * t);
      }

      function lerp(a, b, t) {
        return a + (b - a) * t;
      }

      function platformEdgeX(y) {
        return PLATFORM_FAR_X + ((y - HORIZON_Y) / (HEIGHT - HORIZON_Y)) * (PLATFORM_NEAR_X - PLATFORM_FAR_X);
      }

      function trackCenterX(y) {
        return TRACK_VANISH_X + TRACK_SLOPE * (y - TRACK_VANISH_Y);
      }

      function trackHalfWidth(y) {
        return 8 + (y - HORIZON_Y) * 0.14;
      }

      function drawSkyAndDistantLandscape() {
        const sky = ctx.createLinearGradient(0, 0, 0, 420);
        sky.addColorStop(0, "#7ca8c8");
        sky.addColorStop(0.42, "#d9ccb1");
        sky.addColorStop(1, "#e9b77a");
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, WIDTH, HEIGHT);

        const glow = ctx.createRadialGradient(200, 150, 10, 200, 150, 150);
        glow.addColorStop(0, "rgba(255, 235, 180, 0.92)");
        glow.addColorStop(1, "rgba(255, 216, 132, 0)");
        ctx.fillStyle = glow;
        ctx.fillRect(70, 40, 270, 260);

        inkShape(() => {
          ctx.beginPath();
          ctx.arc(192, 148, 45, 0, Math.PI * 2);
        }, "#f9df9a", "#dba86e", 1.8);

        inkShape(() => {
          ctx.beginPath();
          ctx.moveTo(0, 420);
          ctx.lineTo(0, 332);
          ctx.lineTo(118, 308);
          ctx.lineTo(228, 330);
          ctx.lineTo(332, 292);
          ctx.lineTo(452, 322);
          ctx.lineTo(586, 296);
          ctx.lineTo(710, 318);
          ctx.lineTo(808, 284);
          ctx.lineTo(960, 334);
          ctx.lineTo(960, 420);
          ctx.closePath();
        }, "#7e8f86", "#586861", 1.4);

        inkShape(() => {
          ctx.beginPath();
          ctx.moveTo(0, 448);
          ctx.lineTo(0, 374);
          ctx.lineTo(98, 360);
          ctx.lineTo(196, 388);
          ctx.lineTo(310, 350);
          ctx.lineTo(418, 386);
          ctx.lineTo(514, 352);
          ctx.lineTo(642, 382);
          ctx.lineTo(774, 344);
          ctx.lineTo(960, 406);
          ctx.lineTo(960, 452);
          ctx.closePath();
        }, "#a6ab8c", "#787a71", 1.2);

        ctx.save();
        ctx.globalAlpha = 0.26;
        ctx.fillStyle = grainPattern;
        ctx.fillRect(0, 0, WIDTH, 420);
        ctx.restore();
      }

      function drawStationBuilding() {
        inkShape(() => {
          ctx.beginPath();
          ctx.moveTo(56, 420);
          ctx.lineTo(92, 342);
          ctx.lineTo(260, 302);
          ctx.lineTo(612, 298);
          ctx.lineTo(640, 334);
          ctx.lineTo(640, 422);
          ctx.lineTo(56, 422);
          ctx.closePath();
        }, "#d9c7a8", "#5d5852", 2.2);

        inkShape(() => {
          ctx.beginPath();
          ctx.moveTo(116, 424);
          ctx.lineTo(148, 350);
          ctx.lineTo(586, 348);
          ctx.lineTo(594, 424);
          ctx.closePath();
        }, "#728d8a", "#48555a", 2);

        const windowXs = [186, 236, 286, 336, 386, 434, 484, 536];
        windowXs.forEach((x) => {
          inkShape(() => {
            ctx.beginPath();
            ctx.moveTo(x, 360);
            ctx.lineTo(x + 28, 354);
            ctx.lineTo(x + 28, 400);
            ctx.lineTo(x, 405);
            ctx.closePath();
          }, x % 2 === 0 ? "#d1d7bf" : "#b4cab6", "#3f3d3d", 1.4);
        });

        inkShape(() => {
          ctx.beginPath();
          ctx.moveTo(194, 350);
          ctx.lineTo(510, 348);
          ctx.lineTo(510, 374);
          ctx.lineTo(194, 378);
          ctx.closePath();
        }, "#e4d0a5", "#584f4d", 1.5);

        inkLine(() => {
          ctx.beginPath();
          ctx.moveTo(94, 420);
          ctx.lineTo(94, 470);
          ctx.moveTo(592, 340);
          ctx.lineTo(592, 470);
        }, "#6d6158", 3.2);
      }

      function drawPlatform() {
        inkShape(() => {
          ctx.beginPath();
          ctx.moveTo(0, 600);
          ctx.lineTo(0, 514);
          ctx.lineTo(484, HORIZON_Y);
          ctx.lineTo(PLATFORM_FAR_X, HORIZON_Y);
          ctx.lineTo(PLATFORM_NEAR_X, 600);
          ctx.closePath();
        }, "#c7bca4", "#5d5750", 2);

        ctx.save();
        ctx.globalAlpha = 0.32;
        for (let y = 360; y < 584; y += 28) {
          inkLine(() => {
            ctx.beginPath();
            ctx.moveTo(44, y + 18);
            ctx.lineTo(platformEdgeX(y), y);
          }, "#f5e8cf", 1.2);
        }
        ctx.restore();

        inkLine(() => {
          ctx.beginPath();
          ctx.moveTo(PLATFORM_FAR_X, HORIZON_Y);
          ctx.lineTo(PLATFORM_NEAR_X, 600);
        }, "#d8b66d", 5.5);

        inkLine(() => {
          ctx.beginPath();
          ctx.moveTo(PLATFORM_FAR_X + 12, HORIZON_Y);
          ctx.lineTo(PLATFORM_NEAR_X + 10, 600);
        }, "#7a6350", 2);

        inkShape(() => {
          ctx.beginPath();
          ctx.moveTo(0, 586);
          ctx.lineTo(PLATFORM_NEAR_X, 586);
          ctx.lineTo(PLATFORM_NEAR_X + 20, 600);
          ctx.lineTo(0, 600);
          ctx.closePath();
        }, "#7a756d", "#524c48", 1.5);
      }

      function drawTracksAndTies() {
        inkShape(() => {
          ctx.beginPath();
          const farHalf = trackHalfWidth(HORIZON_Y) + 12;
          const nearHalf = trackHalfWidth(HEIGHT) + 18;
          ctx.moveTo(trackCenterX(HORIZON_Y) - farHalf, HORIZON_Y);
          ctx.lineTo(trackCenterX(HORIZON_Y) + farHalf, HORIZON_Y);
          ctx.lineTo(trackCenterX(HEIGHT) + nearHalf, HEIGHT);
          ctx.lineTo(trackCenterX(HEIGHT) - nearHalf, HEIGHT);
          ctx.closePath();
        }, "#736d68", "#413e3d", 1.6);

        for (let y = 312; y < 592; y += 12) {
          const center = trackCenterX(y);
          const half = trackHalfWidth(y);
          inkLine(() => {
            ctx.beginPath();
            ctx.moveTo(center - half, y);
            ctx.lineTo(center + half, y + (16 + (y - 312) * 0.05));
          }, "#7b5b45", 2.2);
        }

        [-0.56, 0.56].forEach((sway) => {
          inkLine(() => {
            ctx.beginPath();
            ctx.moveTo(trackCenterX(HORIZON_Y) + sway * trackHalfWidth(HORIZON_Y), HORIZON_Y);
            ctx.lineTo(trackCenterX(HEIGHT) + sway * trackHalfWidth(HEIGHT), HEIGHT);
          }, "#d9d0c0", 2.8);
        });
      }

      function drawTrain(elapsed) {
        const arrival = smoothstep((elapsed - 0.55) / (DURATION - 1.1));
        const y = lerp(TRAIN_START_Y, TRAIN_END_Y, arrival);
        const x = trackCenterX(y);
        const scale = 0.46 + arrival * 0.84;

        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(-Math.atan(TRACK_SLOPE));
        ctx.scale(scale, scale);

        inkShape(() => {
          ctx.beginPath();
          ctx.moveTo(-70, -72);
          ctx.lineTo(80, -72);
          ctx.lineTo(92, -12);
          ctx.lineTo(70, 12);
          ctx.lineTo(-70, 12);
          ctx.lineTo(-92, -12);
          ctx.closePath();
        }, "#8f4f4a", "#463b3a", 2.8);

        inkShape(() => {
          ctx.beginPath();
          ctx.moveTo(-52, -62);
          ctx.lineTo(54, -62);
          ctx.lineTo(56, -18);
          ctx.lineTo(-54, -18);
          ctx.closePath();
        }, "#d3ab73", "#4a3d3e", 2);

        inkShape(() => {
          ctx.beginPath();
          ctx.moveTo(-34, -52);
          ctx.lineTo(-8, -52);
          ctx.lineTo(-8, -28);
          ctx.lineTo(-34, -28);
          ctx.closePath();
          ctx.moveTo(10, -52);
          ctx.lineTo(36, -52);
          ctx.lineTo(36, -28);
          ctx.lineTo(10, -28);
          ctx.closePath();
        }, "#c4d9d5", "#3b3c40", 1.8);

        inkShape(() => {
          ctx.beginPath();
          ctx.moveTo(-64, 4);
          ctx.lineTo(64, 4);
          ctx.lineTo(58, 20);
          ctx.lineTo(-58, 20);
          ctx.closePath();
        }, "#d8c59e", "#433d3a", 2.4);

        [-48, 0, 48].forEach((wheelX) => {
          inkShape(() => {
            ctx.beginPath();
            ctx.arc(wheelX, 20, 12, 0, Math.PI * 2);
          }, "#2b2d31", "#1c1d1e", 1.8);
          inkShape(() => {
            ctx.beginPath();
            ctx.arc(wheelX, 20, 4.4, 0, Math.PI * 2);
          }, "#d6dcd8", "#4a4746", 1);
        });

        inkShape(() => {
          ctx.beginPath();
          ctx.moveTo(-20, -16);
          ctx.lineTo(20, -16);
          ctx.lineTo(18, 0);
          ctx.lineTo(-18, 0);
          ctx.closePath();
        }, "#e3b06d", "#4f3d3a", 1.6);
        ctx.restore();
      }

      function drawBench() {
        const scale = 0.82;
        ctx.save();
        ctx.translate(BENCH.x, BENCH.y);
        ctx.scale(scale, scale);

        inkShape(() => {
          ctx.beginPath();
          ctx.moveTo(-58, -18);
          ctx.lineTo(52, -34);
          ctx.lineTo(68, -18);
          ctx.lineTo(-42, -2);
          ctx.closePath();
        }, "#915f42", "#433831", 2);

        inkShape(() => {
          ctx.beginPath();
          ctx.moveTo(-52, -36);
          ctx.lineTo(52, -52);
          ctx.lineTo(52, -36);
          ctx.lineTo(-52, -19);
          ctx.closePath();
        }, "#ba7a53", "#433831", 2);

        inkShape(() => {
          ctx.beginPath();
          ctx.moveTo(-44, -18);
          ctx.lineTo(-38, -18);
          ctx.lineTo(-34, 18);
          ctx.lineTo(-40, 18);
          ctx.closePath();
          ctx.moveTo(32, -30);
          ctx.lineTo(38, -31);
          ctx.lineTo(46, 6);
          ctx.lineTo(40, 7);
          ctx.closePath();
          ctx.moveTo(-28, -40);
          ctx.lineTo(-22, -40);
          ctx.lineTo(-18, -14);
          ctx.lineTo(-24, -14);
          ctx.closePath();
          ctx.moveTo(44, -52);
          ctx.lineTo(50, -53);
          ctx.lineTo(56, -25);
          ctx.lineTo(50, -24);
          ctx.closePath();
        }, "#6d4f3e", "#433831", 1.6);
        ctx.restore();
      }

      function limb(x1, y1, x2, y2, width, color) {
        ctx.save();
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.strokeStyle = "#433d3c";
        ctx.lineWidth = width + 3;
        ctx.stroke();
        ctx.strokeStyle = color;
        ctx.lineWidth = width;
        ctx.stroke();
        ctx.restore();
      }

      function suitcaseHand(phase, gait) {
        return {
          x: 29 + Math.sin(phase) * 3 * gait,
          y: -39 + Math.cos(phase) * 1.8 * gait,
        };
      }

      function drawSuitcase(hand, phase, gait) {
        ctx.save();
        ctx.translate(hand.x, hand.y);
        ctx.rotate(Math.sin(phase) * 0.05 * gait);
        inkShape(() => {
          ctx.beginPath();
          ctx.roundRect(-14, 10, 30, 32, 5);
        }, "#9b5c4f", "#3d393a", 2);
        inkShape(() => {
          ctx.beginPath();
          ctx.roundRect(-5, 2, 11, 11, 2);
        }, "#c28263", "#3d393a", 1.5);
        inkLine(() => {
          ctx.beginPath();
          ctx.moveTo(-9, 12);
          ctx.lineTo(-9, 35);
        }, "#d8ba81", 1.3);
        inkShape(() => {
          ctx.beginPath();
          ctx.arc(8, 24, 2, 0, Math.PI * 2);
        }, "#efd7aa", "#705542", 0.8);
        ctx.restore();
      }

      function drawTraveler(x, y, scale, phase, gait, headTurn) {
        const bob = Math.sin(phase * 2.4) * 2.2 * gait;
        const hand = suitcaseHand(phase, gait);

        ctx.save();
        ctx.translate(x, y + bob);
        ctx.scale(scale, scale);

        const rearPhase = phase + Math.PI;
        const rearFoot = {
          x: -9 + Math.sin(rearPhase) * 13 * gait,
          y: -Math.max(0, Math.cos(rearPhase)) * 5.5 * gait,
        };
        const frontFoot = {
          x: 10 + Math.sin(phase) * 14 * gait,
          y: -Math.max(0, Math.cos(phase)) * 5.5 * gait,
        };

        limb(-7, -30, -11 + rearFoot.x * 0.5, -18, 8, "#5d7184");
        limb(-11 + rearFoot.x * 0.5, -18, rearFoot.x, rearFoot.y, 6, "#33465a");
        limb(8, -30, 9 + frontFoot.x * 0.45, -18, 8, "#61788a");
        limb(9 + frontFoot.x * 0.45, -18, frontFoot.x, frontFoot.y, 6, "#33465a");
        inkShape(() => {
          ctx.beginPath();
          ctx.ellipse(rearFoot.x + 2, rearFoot.y, 8.8, 3.4, -0.08, 0, Math.PI * 2);
        }, "#a35d4d", "#3e3937", 1.2);
        inkShape(() => {
          ctx.beginPath();
          ctx.ellipse(frontFoot.x + 2, frontFoot.y, 8.8, 3.4, -0.08, 0, Math.PI * 2);
        }, "#b86851", "#3e3937", 1.2);

        limb(-8, -70, -18 - Math.sin(phase) * 4 * gait, -56, 8, "#c99567");
        limb(-18 - Math.sin(phase) * 4 * gait, -56, -19 - Math.sin(phase) * 6 * gait, -41, 6, "#9f6251");
        inkShape(() => {
          ctx.beginPath();
          ctx.arc(-19 - Math.sin(phase) * 6 * gait, -41, 4.2, 0, Math.PI * 2);
        }, "#e8b992", "#433d3c", 1.2);

        limb(8, -70, 18, -58, 9, "#c98e67");
        limb(18, -58, hand.x, hand.y, 6.5, "#9c5d4d");

        inkShape(() => {
          ctx.beginPath();
          ctx.moveTo(-16, -78);
          ctx.quadraticCurveTo(-8, -88, 8, -83);
          ctx.lineTo(22, -72);
          ctx.lineTo(18, -42);
          ctx.quadraticCurveTo(2, -34, -14, -42);
          ctx.closePath();
        }, "#4d697d", "#2f3035", 2.2);
        inkShape(() => {
          ctx.beginPath();
          ctx.moveTo(-7, -74);
          ctx.quadraticCurveTo(2, -73, 9, -67);
          ctx.lineTo(13, -46);
          ctx.quadraticCurveTo(1, -40, -8, -46);
          ctx.closePath();
        }, "#36596c", "#2f3035", 1.4);

        inkShape(() => {
          ctx.beginPath();
          ctx.moveTo(-16, -45);
          ctx.quadraticCurveTo(2, -38, 17, -45);
          ctx.lineTo(16, -35);
          ctx.quadraticCurveTo(2, -28, -15, -35);
          ctx.closePath();
        }, "#4a6072", "#2f3035", 1.6);

        ctx.save();
        ctx.translate(2, -92 + bob * 0.35);
        ctx.rotate(headTurn * 0.72);

        inkShape(() => {
          ctx.beginPath();
          ctx.moveTo(-15, 1);
          ctx.quadraticCurveTo(-18, -18, -2, -29);
          ctx.quadraticCurveTo(13, -35, 27, -20);
          ctx.lineTo(29, 0);
          ctx.quadraticCurveTo(20, 14, 1, 11);
          ctx.quadraticCurveTo(-10, 12, -15, 1);
          ctx.closePath();
        }, "#e9be92", "#3f3737", 1.9);

        inkShape(() => {
          ctx.beginPath();
          ctx.moveTo(-13, -7);
          ctx.quadraticCurveTo(-17, -28, 0, -34);
          ctx.quadraticCurveTo(16, -35, 28, -22);
          ctx.lineTo(19, -18);
          ctx.lineTo(10, -18);
          ctx.lineTo(2, -24);
          ctx.lineTo(-4, -17);
          ctx.lineTo(-10, -18);
          ctx.lineTo(-10, 4);
          ctx.closePath();
        }, "#403b3d", "#272628", 2);

        inkShape(() => {
          ctx.beginPath();
          ctx.ellipse(8, -7, 3.4, 4.4, 0, 0, Math.PI * 2);
          ctx.ellipse(20, -7, 3.1, 4.1, 0, 0, Math.PI * 2);
        }, "#fdf1df", "#3c3435", 1.1);

        inkShape(() => {
          const shift = headTurn * 2.2;
          ctx.beginPath();
          ctx.arc(8 + shift, -7, 1.4, 0, Math.PI * 2);
          ctx.arc(20 + shift, -7, 1.3, 0, Math.PI * 2);
        }, "#2b2d32", "#2b2d32", 0.9);

        inkLine(() => {
          ctx.beginPath();
          ctx.moveTo(12, 3);
          ctx.quadraticCurveTo(17, 8, 24, 2);
          ctx.moveTo(24, -2);
          ctx.lineTo(27, 1);
        }, "#704b42", 1.4);

        inkLine(() => {
          ctx.beginPath();
          ctx.moveTo(0, 2);
          ctx.lineTo(10, 0);
          ctx.moveTo(18, 2);
          ctx.lineTo(26, 4);
        }, "#5c4143", 1.2);
        ctx.restore();

        inkShape(() => {
          ctx.beginPath();
          ctx.arc(hand.x, hand.y, 4.5, 0, Math.PI * 2);
        }, "#e9be92", "#433d3c", 1.2);
        drawSuitcase(hand, phase, gait);

        inkLine(() => {
          const wind = Math.sin(phase * 0.8) * 2.6 * gait;
          ctx.beginPath();
          ctx.moveTo(-14, -82);
          ctx.quadraticCurveTo(-26 - wind, -78, -30 - wind, -67);
          ctx.moveTo(-10, -74);
          ctx.quadraticCurveTo(-19 - wind, -67, -24 - wind, -59);
        }, "#413b3a", 1.8);
        ctx.restore();
      }

      function drawForegroundPlatform() {
        inkShape(() => {
          ctx.beginPath();
          ctx.moveTo(0, 600);
          ctx.lineTo(0, 588);
          ctx.lineTo(PLATFORM_NEAR_X, 588);
          ctx.lineTo(PLATFORM_NEAR_X + 30, 600);
          ctx.closePath();
        }, "#7a736b", "#4e4a47", 1.5);
      }

      function drawScene(elapsed) {
        drawSkyAndDistantLandscape();
        drawStationBuilding();
        drawTracksAndTies();
        drawTrain(elapsed);
        drawPlatform();
        drawBench();

        const walk = smoothstep(elapsed / WALK_DURATION);
        const x = lerp(WALK_START.x, WALK_STOP.x, walk);
        const y = lerp(WALK_START.y, WALK_STOP.y, walk);
        const scale = 0.88 + (y - WALK_STOP.y) * 0.0032;
        const walkIn = Math.min(1, elapsed / 0.5);
        const walkOut = Math.min(1, Math.max(0, (WALK_DURATION - elapsed) / 0.7));
        const gait = elapsed < WALK_DURATION ? Math.min(walkIn, walkOut) : 0;
        const phase = elapsed * 7.2;
        const headTurn = smoothstep((elapsed - 6.2) / 1.1);
        drawTraveler(x, y, scale, phase, gait, headTurn);
        drawForegroundPlatform();

        ctx.save();
        ctx.globalAlpha = 0.085;
        ctx.fillStyle = grainPattern;
        ctx.fillRect(0, 0, WIDTH, HEIGHT);
        ctx.restore();
      }

      function resizeCanvas() {
        const bounds = canvas.getBoundingClientRect();
        const ratio = window.devicePixelRatio || 1;
        canvas.width = Math.max(1, Math.round(bounds.width * ratio));
        canvas.height = Math.max(1, Math.round(bounds.height * ratio));
        ctx.setTransform(canvas.width / WIDTH, 0, 0, canvas.height / HEIGHT, 0, 0);
      }

      window.addEventListener("resize", resizeCanvas);
      resizeCanvas();

      let startTime = null;
      function animate(now) {
        if (startTime === null) startTime = now;
        const elapsed = Math.min(DURATION, (now - startTime) / 1000);
        drawScene(elapsed);
        if (elapsed < DURATION) requestAnimationFrame(animate);
      }

      requestAnimationFrame(animate);
    }
  </script>
</body>
</html>
