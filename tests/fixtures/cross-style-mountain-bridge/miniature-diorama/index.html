<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Mountain Bridge Delivery in a Miniature Diorama style.">
  <title>Mountain Bridge Delivery — Miniature Diorama</title>
  <style>
    :root {
      color-scheme: dark;
      background: #262b31;
      font-family: system-ui, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background:
        radial-gradient(ellipse at 50% 35%, #59636a 0, #343a40 58%, #1b1e22 100%);
    }

    body {
      display: grid;
      min-height: 100vh;
      place-items: center;
      padding: 1rem;
    }

    main {
      position: relative;
      width: min(96vw, 88vh, 1280px);
      aspect-ratio: 16 / 9;
      overflow: hidden;
      border: 8px solid #54483b;
      border-radius: 12px;
      background: #b7c4c0;
      box-shadow: 0 24px 70px rgb(0 0 0 / 48%);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #error {
      position: absolute;
      inset: 0;
      display: none;
      overflow: auto;
      padding: 1rem;
      color: #fff0ee;
      background: rgb(65 18 18 / 94%);
      font: 14px/1.5 ui-monospace, monospace;
      white-space: pre-wrap;
    }

    #error.visible {
      display: block;
    }
  </style>
</head>
<body>
  <main aria-label="Mountain Bridge Delivery miniature scene">
    <canvas id="scene" aria-label="Delivery truck crossing a wooden mountain bridge"></canvas>
    <output id="error" role="alert" aria-live="assertive"></output>
  </main>
  <script type="module">
    const canvas = document.querySelector("#scene");
    const errorPanel = document.querySelector("#error");

    try {
      const THREE = await import(
        "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js"
      );
      startScene(THREE);
    } catch (error) {
      console.error("Miniature Diorama scene initialization failed:", error);
      errorPanel.textContent = `Scene initialization failed:\n${error?.message ?? error}`;
      errorPanel.classList.add("visible");
    }

    function startScene(THREE) {
      const DURATION = 8;
      const DRIVE_DURATION = 7.2;
      const ROAD_WIDTH = 2.45;
      const BRIDGE_START = 0.37;
      const BRIDGE_END = 0.64;
      const WHEEL_RADIUS = 0.32;
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0xc0c9c7);
      scene.fog = new THREE.Fog(0xc0c9c7, 32, 63);

      const camera = new THREE.OrthographicCamera(-17.8, 17.8, 10.0, -10.0, 0.1, 120);
      camera.position.set(18, 19, 23);
      camera.lookAt(0, 0.95, -0.7);

      const renderer = new THREE.WebGLRenderer({
        canvas,
        antialias: true,
        alpha: false
      });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.7));
      renderer.setSize(canvas.clientWidth, canvas.clientHeight, false);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.06;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFShadowMap;

      scene.add(new THREE.HemisphereLight(0xffe6c6, 0x53624f, 1.6));
      const keyLight = new THREE.DirectionalLight(0xffd69a, 3.1);
      keyLight.position.set(-11, 19, 11);
      keyLight.castShadow = true;
      keyLight.shadow.mapSize.set(1536, 1536);
      keyLight.shadow.camera.left = -18;
      keyLight.shadow.camera.right = 18;
      keyLight.shadow.camera.top = 18;
      keyLight.shadow.camera.bottom = -18;
      keyLight.shadow.normalBias = 0.035;
      scene.add(keyLight);

      const fillLight = new THREE.DirectionalLight(0x9dbddd, 0.8);
      fillLight.position.set(12, 9, -12);
      scene.add(fillLight);

      function makeTexture(base, accents, size = 96) {
        const textureCanvas = document.createElement("canvas");
        textureCanvas.width = size;
        textureCanvas.height = size;
        const context = textureCanvas.getContext("2d");
        context.fillStyle = base;
        context.fillRect(0, 0, size, size);
        for (let i = 0; i < size * 2; i += 1) {
          const x = (i * 37 + 11) % size;
          const y = (i * 61 + 17) % size;
          context.fillStyle = accents[i % accents.length];
          context.fillRect(x, y, 2 + i % 4, 1 + i % 3);
        }
        const texture = new THREE.CanvasTexture(textureCanvas);
        texture.wrapS = THREE.RepeatWrapping;
        texture.wrapT = THREE.RepeatWrapping;
        texture.repeat.set(3, 3);
        texture.colorSpace = THREE.SRGBColorSpace;
        texture.needsUpdate = true;
        return texture;
      }

      const materials = {
        plinth: new THREE.MeshStandardMaterial({ color: 0x503b2b, roughness: 0.78 }),
        plinthTrim: new THREE.MeshStandardMaterial({ color: 0x8c6844, roughness: 0.62 }),
        ground: new THREE.MeshStandardMaterial({
          color: 0xb5b47c,
          map: makeTexture("#969966", ["#a6a674", "#85885d", "#b4a779"]),
          roughness: 0.95,
          flatShading: true
        }),
        hill: new THREE.MeshStandardMaterial({ color: 0x71855e, roughness: 0.98, flatShading: true }),
        hillLight: new THREE.MeshStandardMaterial({ color: 0x9a9a69, roughness: 0.98, flatShading: true }),
        rock: new THREE.MeshStandardMaterial({ color: 0x81796a, roughness: 0.96, flatShading: true }),
        roadBed: new THREE.MeshStandardMaterial({ color: 0x9a8463, roughness: 0.94, flatShading: true }),
        road: new THREE.MeshStandardMaterial({
          color: 0x5d5b55,
          map: makeTexture("#565650", ["#68645a", "#4d504c", "#777064"]),
          roughness: 0.9,
          flatShading: true
        }),
        roadEdge: new THREE.MeshStandardMaterial({ color: 0xd5c29a, roughness: 0.88 }),
        water: new THREE.MeshStandardMaterial({
          color: 0x669e9d,
          roughness: 0.34,
          metalness: 0.12,
          transparent: true,
          opacity: 0.9
        }),
        bank: new THREE.MeshStandardMaterial({ color: 0x786f59, roughness: 0.95, flatShading: true }),
        wood: new THREE.MeshStandardMaterial({ color: 0x815b39, roughness: 0.84, flatShading: true }),
        woodLight: new THREE.MeshStandardMaterial({ color: 0xb08553, roughness: 0.8, flatShading: true }),
        woodDark: new THREE.MeshStandardMaterial({ color: 0x4f3d2c, roughness: 0.91 }),
        truckPaint: new THREE.MeshStandardMaterial({ color: 0xd18a4d, roughness: 0.55, metalness: 0.05, flatShading: true }),
        truckTrim: new THREE.MeshStandardMaterial({ color: 0x743f32, roughness: 0.66 }),
        window: new THREE.MeshStandardMaterial({ color: 0x476779, roughness: 0.25, metalness: 0.18 }),
        tire: new THREE.MeshStandardMaterial({ color: 0x292a28, roughness: 0.94, flatShading: true }),
        hub: new THREE.MeshStandardMaterial({ color: 0xc3aa78, roughness: 0.48, metalness: 0.28 }),
        leaf: new THREE.MeshStandardMaterial({ color: 0x617d4e, roughness: 0.92, flatShading: true })
      };

      function addMesh(geometry, material, parent = scene, castShadow = true, receiveShadow = true) {
        const mesh = new THREE.Mesh(geometry, material);
        mesh.castShadow = castShadow;
        mesh.receiveShadow = receiveShadow;
        parent.add(mesh);
        return mesh;
      }

      function addBox(parent, material, size, position, rotationY = 0, castShadow = true) {
        const mesh = addMesh(new THREE.BoxGeometry(...size), material, parent, castShadow);
        mesh.position.set(...position);
        mesh.rotation.y = rotationY;
        return mesh;
      }

      function makeRibbon(path, start, end, width, material, yOffset = 0, steps = 80) {
        const positions = [];
        const uvs = [];
        const indices = [];
        const count = Math.max(2, Math.ceil((end - start) * steps));
        for (let i = 0; i <= count; i += 1) {
          const u = start + (end - start) * (i / count);
          const point = path.getPointAt(u);
          const tangent = path.getTangentAt(u);
          const lateral = new THREE.Vector3(-tangent.z, 0, tangent.x).normalize();
          const left = point.clone().addScaledVector(lateral, width / 2);
          const right = point.clone().addScaledVector(lateral, -width / 2);
          positions.push(left.x, point.y + yOffset, left.z, right.x, point.y + yOffset, right.z);
          uvs.push(0, i / count, 1, i / count);
          if (i < count) {
            const a = i * 2;
            indices.push(a, a + 2, a + 1, a + 1, a + 2, a + 3);
          }
        }
        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
        geometry.setAttribute("uv", new THREE.Float32BufferAttribute(uvs, 2));
        geometry.setIndex(indices);
        geometry.computeVertexNormals();
        return addMesh(geometry, material, scene, false, true);
      }

      function addHill(x, z, scale, material, detail = 1) {
        const hill = addMesh(
          new THREE.IcosahedronGeometry(1, detail),
          material,
          scene,
          true,
          true
        );
        hill.position.set(x, 0.42 + scale[1] * 0.58, z);
        hill.scale.set(...scale);
        return hill;
      }

      const route = new THREE.CatmullRomCurve3([
        new THREE.Vector3(-11.5, 0.82, 5.5),
        new THREE.Vector3(-7.4, 0.82, 4.0),
        new THREE.Vector3(-4.0, 0.82, 1.9),
        new THREE.Vector3(-0.7, 0.82, 0.25),
        new THREE.Vector3(2.7, 0.82, -1.45),
        new THREE.Vector3(5.4, 0.82, -3.25),
        new THREE.Vector3(7.45, 0.82, -4.65)
      ], false, "catmullrom", 0.15);

      const island = addMesh(
        new THREE.CylinderGeometry(13.1, 13.45, 0.78, 40),
        materials.plinth,
        scene,
        true,
        true
      );
      island.position.y = -0.02;
      const islandTop = addMesh(
        new THREE.CylinderGeometry(12.92, 13.12, 0.18, 40),
        materials.ground,
        scene,
        false,
        true
      );
      islandTop.position.y = 0.42;
      const trim = addMesh(
        new THREE.CylinderGeometry(13.18, 13.48, 0.14, 40),
        materials.plinthTrim,
        scene,
        true,
        false
      );
      trim.position.y = -0.17;

      addHill(-8.6, -6.5, [3.4, 2.7, 2.5], materials.hill, 1);
      addHill(-1.5, -8.0, [3.8, 3.3, 2.6], materials.rock, 1);
      addHill(5.4, -7.4, [3.7, 2.8, 2.4], materials.hillLight, 1);
      addHill(10.2, 1.3, [2.4, 2.0, 3.0], materials.rock, 1);
      addHill(-11.0, 0.0, [2.1, 1.8, 2.8], materials.hill, 1);

      const streamPath = new THREE.CatmullRomCurve3([
        new THREE.Vector3(-0.12, 0.57, -9.0),
        new THREE.Vector3(0.08, 0.57, -5.0),
        new THREE.Vector3(-0.16, 0.57, -1.4),
        new THREE.Vector3(0.12, 0.57, 2.5),
        new THREE.Vector3(-0.1, 0.57, 6.0),
        new THREE.Vector3(0.14, 0.57, 9.0)
      ], false, "catmullrom", 0.2);
      makeRibbon(streamPath, 0, 1, 1.05, materials.water, 0, 90);

      const bridgeMaterials = [materials.wood, materials.woodLight, materials.woodDark];
      for (let i = 0; i <= 27; i += 1) {
        const u = BRIDGE_START + (BRIDGE_END - BRIDGE_START) * (i / 27);
        const point = route.getPointAt(u);
        const tangent = route.getTangentAt(u);
        const yaw = Math.atan2(tangent.x, tangent.z);
        const plank = addBox(
          scene,
          bridgeMaterials[i % bridgeMaterials.length],
          [3.0, 0.16, 0.34],
          [point.x, point.y - 0.08, point.z],
          yaw
        );
        plank.receiveShadow = true;
      }

      for (const side of [-1, 1]) {
        const railPoints = [];
        for (let i = 0; i <= 18; i += 1) {
          const u = BRIDGE_START + (BRIDGE_END - BRIDGE_START) * (i / 18);
          const point = route.getPointAt(u);
          const tangent = route.getTangentAt(u);
          const lateral = new THREE.Vector3(-tangent.z, 0, tangent.x).normalize();
          railPoints.push(
            point.clone().addScaledVector(lateral, side * 1.47).setY(point.y + 0.52)
          );
        }
        const railPath = new THREE.CatmullRomCurve3(railPoints);
        addMesh(new THREE.TubeGeometry(railPath, 54, 0.055, 7, false), materials.woodDark);
        for (let i = 0; i <= 6; i += 1) {
          const u = BRIDGE_START + (BRIDGE_END - BRIDGE_START) * (i / 6);
          const point = route.getPointAt(u);
          const tangent = route.getTangentAt(u);
          const lateral = new THREE.Vector3(-tangent.z, 0, tangent.x).normalize();
          const postPosition = point.clone().addScaledVector(lateral, side * 1.47);
          addBox(scene, materials.wood, [0.14, 0.5, 0.14], [
            postPosition.x,
            point.y + 0.23,
            postPosition.z
          ], Math.atan2(tangent.x, tangent.z));
        }
      }

      for (const [start, end] of [[0, BRIDGE_START], [BRIDGE_END, 1]]) {
        makeRibbon(route, start, end, ROAD_WIDTH + 0.45, materials.roadBed, -0.1, 100);
        makeRibbon(route, start, end, ROAD_WIDTH, materials.road, -0.01, 100);
        for (const side of [-1, 1]) {
          const edgePath = [];
          for (let i = 0; i <= 26; i += 1) {
            const u = start + (end - start) * (i / 26);
            const point = route.getPointAt(u);
            const tangent = route.getTangentAt(u);
            const lateral = new THREE.Vector3(-tangent.z, 0, tangent.x).normalize();
            edgePath.push(
              point.clone().addScaledVector(lateral, side * (ROAD_WIDTH / 2 - 0.08)).setY(point.y + 0.01)
            );
          }
          addMesh(
            new THREE.TubeGeometry(new THREE.CatmullRomCurve3(edgePath), 60, 0.025, 5, false),
            materials.roadEdge,
            scene,
            false,
            false
          );
        }
      }

      function makeTree(x, z, size = 1) {
        const trunk = addMesh(
          new THREE.CylinderGeometry(0.09 * size, 0.13 * size, 0.85 * size, 8),
          materials.woodDark
        );
        trunk.position.set(x, 0.83 * size, z);
        for (let tier = 0; tier < 3; tier += 1) {
          const crown = addMesh(
            new THREE.ConeGeometry((0.58 - tier * 0.1) * size, 0.92 * size, 8),
            materials.leaf
          );
          crown.position.set(x, (1.18 + tier * 0.48) * size, z);
        }
      }

      for (const tree of [
        [-10.2, -4.8, 0.9], [-7.2, -8.7, 1.0], [1.4, -9.4, 0.86],
        [7.4, -7.8, 0.88], [11.4, 2.6, 0.9], [-10.9, 2.4, 0.8]
      ]) {
        makeTree(...tree);
      }

      const warehouse = new THREE.Group();
      const warehousePosition = new THREE.Vector3(9.42, 0.51, -2.28);
      warehouse.position.copy(warehousePosition);
      scene.add(warehouse);
      addBox(warehouse, materials.woodLight, [3.0, 2.0, 2.35], [0, 1.0, 0]);
      addBox(warehouse, materials.woodDark, [0.16, 2.05, 0.13], [-1.4, 1.02, 1.18]);
      addBox(warehouse, materials.woodDark, [0.16, 2.05, 0.13], [1.4, 1.02, 1.18]);
      addBox(warehouse, materials.woodDark, [2.9, 0.14, 0.12], [0, 1.92, 1.18]);
      addBox(warehouse, materials.wood, [1.0, 1.42, 0.1], [0.42, 0.72, 1.22]);
      addBox(warehouse, materials.woodDark, [0.08, 1.42, 0.08], [-0.08, 0.72, 1.28]);
      const leftRoof = addBox(warehouse, materials.woodDark, [1.9, 0.17, 2.75], [-0.82, 2.55, 0]);
      leftRoof.rotation.z = 0.4;
      const rightRoof = addBox(warehouse, materials.woodDark, [1.9, 0.17, 2.75], [0.82, 2.55, 0]);
      rightRoof.rotation.z = -0.4;
      addBox(warehouse, materials.wood, [0.15, 2.0, 0.13], [0, 1.0, -1.08]);

      const truck = new THREE.Group();
      scene.add(truck);
      addBox(truck, materials.truckPaint, [1.48, 0.76, 1.56], [0, 1.0, -0.58]);
      addBox(truck, materials.truckTrim, [1.35, 0.7, 0.98], [0, 0.92, 0.88]);
      addBox(truck, materials.truckPaint, [1.38, 0.12, 0.62], [0, 0.59, 1.22]);
      addBox(truck, materials.window, [1.12, 0.4, 0.05], [0, 1.14, 1.39], 0, false);
      addBox(truck, materials.window, [0.05, 0.38, 0.72], [-0.7, 1.13, 0.9], 0, false);
      addBox(truck, materials.window, [0.05, 0.38, 0.72], [0.7, 1.13, 0.9], 0, false);
      addBox(truck, materials.hub, [1.22, 0.16, 0.12], [0, 0.5, 1.62]);
      for (const x of [-0.5, 0.5]) {
        addBox(truck, materials.hub, [0.27, 0.14, 0.06], [x, 0.92, 1.42], 0, false);
      }

      const wheelSpinners = [];
      for (const x of [-0.82, 0.82]) {
        for (const z of [-0.98, 0.98]) {
          const spinner = new THREE.Group();
          spinner.position.set(x, 0.32, z);
          truck.add(spinner);
          const tire = addMesh(
            new THREE.CylinderGeometry(WHEEL_RADIUS, WHEEL_RADIUS, 0.24, 14),
            materials.tire,
            spinner
          );
          tire.rotation.z = Math.PI / 2;
          const hub = addMesh(
            new THREE.CylinderGeometry(0.18, 0.18, 0.27, 12),
            materials.hub,
            spinner
          );
          hub.rotation.z = Math.PI / 2;
          for (const side of [-1, 1]) {
            for (let spokeIndex = 0; spokeIndex < 5; spokeIndex += 1) {
              const angle = spokeIndex * Math.PI * 2 / 5;
              const spoke = addBox(
                spinner,
                materials.truckTrim,
                [0.035, 0.13, 0.045],
                [side * 0.145, Math.cos(angle) * 0.08, Math.sin(angle) * 0.08],
                0,
                false
              );
              spoke.rotation.x = angle;
            }
          }
          wheelSpinners.push(spinner);
        }
      }

      const roadDistance = route.getLength();
      const startTime = performance.now();

      function animate(now) {
        const elapsed = Math.min((now - startTime) / 1000, DURATION);
        const progress = Math.min(elapsed / DRIVE_DURATION, 1);
        const eased = progress * progress * (3 - 2 * progress);
        const point = route.getPointAt(eased);
        const tangent = route.getTangentAt(eased);
        truck.position.copy(point);
        truck.rotation.y = Math.atan2(tangent.x, tangent.z);
        const traveled = roadDistance * eased;
        for (const wheel of wheelSpinners) {
          wheel.rotation.x = traveled / WHEEL_RADIUS;
        }
        renderer.render(scene, camera);
        if (elapsed < DURATION) requestAnimationFrame(animate);
      }

      function resize() {
        const width = canvas.clientWidth;
        const height = canvas.clientHeight;
        if (width === 0 || height === 0) return;
        const aspect = width / height;
        const halfHeight = 10.0;
        camera.left = -halfHeight * aspect;
        camera.right = halfHeight * aspect;
        camera.top = halfHeight;
        camera.bottom = -halfHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(width, height, false);
      }

      window.addEventListener("resize", resize);
      resize();
      requestAnimationFrame(animate);
    }
  </script>
</body>
</html>
