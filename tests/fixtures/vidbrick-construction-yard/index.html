<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Toy Brick Construction Yard</title>
  <style>
    :root {
      color-scheme: dark;
      background: #28384b;
      font-family: system-ui, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: #28384b;
    }

    main {
      width: min(96vw, 1120px);
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 16 / 10;
      border: 4px solid #182436;
      background: #a7d8ed;
    }

    #init-error {
      margin: 0;
      padding: 0.75rem;
      color: #fff;
      background: #8b2f36;
    }

    #init-error[hidden] {
      display: none;
    }
  </style>
</head>
<body>
  <main>
    <canvas id="scene" role="img"
      aria-label="Toy-brick excavator loads a brick into a dump truck, which then drives forward.">
      WebGL is required to display this scene.
    </canvas>
    <p id="init-error" role="alert" hidden></p>
  </main>
  <script type="module">
    "use strict";

    (async function startScene() {
      const canvas = document.getElementById("scene");
      const errorPanel = document.getElementById("init-error");

      try {
        const THREE = await import(
          "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js"
        );

        const WIDTH = 960;
        const HEIGHT = 600;
        const DURATION = 10;
        const STUD_PITCH = 0.26;
        const BRICK_HEIGHT = 0.18;
        const STUD_RADIUS = 0.075;
        const STUD_HEIGHT = 0.07;
        const SEAM_GAP = 0.012;
        const TRUCK_START_X = 0.95;
        const TRUCK_DRIVE_DISTANCE = 0.62;
        const TRUCK_WHEEL_RADIUS = 0.23;
        const BED_LOAD_X = -0.4;
        const BED_LOAD_Y = 0.8;
        const PICK_TARGET = new THREE.Vector3(-0.55, 0.86, 0);
        const DUMP_TARGET = new THREE.Vector3(TRUCK_START_X + BED_LOAD_X, 0.98, 0);
        const REST_TARGET = new THREE.Vector3(-0.5, 1.9, 0);
        const BOOM_LENGTH = 1.56;
        const STICK_LENGTH = 1.3;

        const COLORS = {
          blue: 0x168fce,
          blueLight: 0x52c5e8,
          dark: 0x343e4a,
          gray: 0x9ca8af,
          grayLight: 0xd7e0e0,
          green: 0x48a66a,
          orange: 0xf18a32,
          red: 0xe54845,
          tire: 0x303743,
          yellow: 0xffc928
        };

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xa7d8ed);
        scene.fog = new THREE.Fog(0xa7d8ed, 17, 34);

        const camera = new THREE.PerspectiveCamera(38, WIDTH / HEIGHT, 0.1, 80);
        camera.position.set(6.3, 7.4, 12.6);
        camera.lookAt(-0.05, 0.75, 0);

        const renderer = new THREE.WebGLRenderer({
          canvas,
          antialias: true,
          alpha: false
        });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        renderer.setSize(WIDTH, HEIGHT, false);
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFShadowMap;

        const materials = new Map();
        function plastic(color) {
          if (!materials.has(color)) {
            materials.set(color, new THREE.MeshPhysicalMaterial({
              color,
              roughness: 0.24,
              metalness: 0,
              clearcoat: 0.72,
              clearcoatRoughness: 0.18
            }));
          }
          return materials.get(color);
        }

        function brick(cols, rows, color, heightUnits = 1) {
          const group = new THREE.Group();
          const width = cols * STUD_PITCH;
          const depth = rows * STUD_PITCH;
          const height = heightUnits * BRICK_HEIGHT;
          const body = new THREE.Mesh(
            new THREE.BoxGeometry(
              Math.max(0.05, width - SEAM_GAP),
              Math.max(0.05, height - SEAM_GAP),
              Math.max(0.05, depth - SEAM_GAP)
            ),
            plastic(color)
          );
          body.position.y = height / 2;
          body.castShadow = true;
          body.receiveShadow = true;
          group.add(body);

          const studGeometry = new THREE.CylinderGeometry(
            STUD_RADIUS, STUD_RADIUS, STUD_HEIGHT, 12
          );
          for (let col = 0; col < cols; col += 1) {
            for (let row = 0; row < rows; row += 1) {
              const stud = new THREE.Mesh(studGeometry, plastic(color));
              stud.position.set(
                (col - (cols - 1) / 2) * STUD_PITCH,
                height + STUD_HEIGHT / 2,
                (row - (rows - 1) / 2) * STUD_PITCH
              );
              stud.castShadow = true;
              stud.receiveShadow = true;
              group.add(stud);
            }
          }
          return group;
        }

        function addBrick(parent, x, y, z, cols, rows, color, heightUnits = 1) {
          const piece = brick(cols, rows, color, heightUnits);
          piece.position.set(x, y, z);
          parent.add(piece);
          return piece;
        }

        function makeWheel(parent, x, y, z, radius, width, animate) {
          const spinPivot = new THREE.Group();
          spinPivot.position.set(x, y, z);
          parent.add(spinPivot);

          const tire = new THREE.Mesh(
            new THREE.CylinderGeometry(radius, radius, width, 18),
            plastic(COLORS.tire)
          );
          tire.rotation.x = Math.PI / 2;
          tire.castShadow = true;
          tire.receiveShadow = true;
          spinPivot.add(tire);

          for (const side of [-1, 1]) {
            const hub = new THREE.Mesh(
              new THREE.CylinderGeometry(radius * 0.43, radius * 0.43, 0.035, 12),
              plastic(COLORS.yellow)
            );
            hub.rotation.x = Math.PI / 2;
            hub.position.z = side * (width / 2 + 0.02);
            spinPivot.add(hub);

            for (let spoke = 0; spoke < 6; spoke += 1) {
              const angle = spoke * Math.PI / 3;
              const bar = new THREE.Mesh(
                new THREE.BoxGeometry(radius * 0.76, 0.025, 0.018),
                plastic(COLORS.grayLight)
              );
              bar.position.set(
                Math.cos(angle) * radius * 0.22,
                Math.sin(angle) * radius * 0.22,
                side * (width / 2 + 0.043)
              );
              bar.rotation.z = angle;
              spinPivot.add(bar);
            }
          }

          if (animate) {
            truckWheels.push(spinPivot);
          }
          return spinPivot;
        }

        const ambient = new THREE.HemisphereLight(0xe4f6ff, 0x735b42, 2.0);
        scene.add(ambient);
        const keyLight = new THREE.DirectionalLight(0xfff0cf, 3.2);
        keyLight.position.set(-4, 10, 7);
        keyLight.castShadow = true;
        keyLight.shadow.mapSize.set(1024, 1024);
        keyLight.shadow.camera.left = -8;
        keyLight.shadow.camera.right = 8;
        keyLight.shadow.camera.top = 8;
        keyLight.shadow.camera.bottom = -8;
        scene.add(keyLight);
        const fillLight = new THREE.DirectionalLight(0xd0efff, 1.0);
        fillLight.position.set(6, 5, -5);
        scene.add(fillLight);

        const ground = new THREE.Mesh(
          new THREE.PlaneGeometry(200, 200),
          new THREE.MeshStandardMaterial({ color: 0x91c6db, roughness: 0.8 })
        );
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -0.24;
        ground.receiveShadow = true;
        scene.add(ground);

        const platform = new THREE.Group();
        scene.add(platform);
        const platformBody = new THREE.Mesh(
          new THREE.BoxGeometry(9.8, 0.22, 4.8),
          plastic(COLORS.gray)
        );
        platformBody.position.y = -0.11;
        platformBody.castShadow = true;
        platformBody.receiveShadow = true;
        platform.add(platformBody);

        const baseStuds = new THREE.InstancedMesh(
          new THREE.CylinderGeometry(STUD_RADIUS, STUD_RADIUS, STUD_HEIGHT, 10),
          plastic(COLORS.gray),
          36 * 17
        );
        const studTransform = new THREE.Object3D();
        let studIndex = 0;
        for (let col = 0; col < 36; col += 1) {
          for (let row = 0; row < 17; row += 1) {
            studTransform.position.set(
              -4.55 + col * STUD_PITCH,
              STUD_HEIGHT / 2,
              -2.08 + row * STUD_PITCH
            );
            studTransform.updateMatrix();
            baseStuds.setMatrixAt(studIndex, studTransform.matrix);
            studIndex += 1;
          }
        }
        baseStuds.instanceMatrix.needsUpdate = true;
        platform.add(baseStuds);

        const truckWheels = [];
        const excavator = new THREE.Group();
        excavator.position.set(-2.35, 0, 0);
        scene.add(excavator);

        for (const side of [-1, 1]) {
          addBrick(excavator, 0, 0.12, side * 0.52, 6, 2, COLORS.dark);
          makeWheel(excavator, -0.52, 0.24, side * 0.91, 0.21, 0.12, false);
          makeWheel(excavator, 0.52, 0.24, side * 0.91, 0.21, 0.12, false);
        }
        addBrick(excavator, 0, 0.30, 0, 5, 3, COLORS.yellow);

        const upper = new THREE.Group();
        upper.position.y = 0.48;
        excavator.add(upper);
        addBrick(upper, -0.04, 0, 0, 4, 3, COLORS.orange, 2);
        addBrick(upper, -0.25, 0.36, 0, 2, 2, COLORS.blue, 2);
        addBrick(upper, -0.05, 0.62, 0.27, 2, 1, COLORS.blueLight);
        addBrick(upper, -0.46, 0.38, -0.28, 1, 1, COLORS.gray);

        const armPivot = new THREE.Group();
        armPivot.position.set(0.35, 0.88, 0);
        upper.add(armPivot);

        const boomPivot = new THREE.Group();
        armPivot.add(boomPivot);
        addBrick(boomPivot, BOOM_LENGTH / 2, -0.08, 0, 6, 1, COLORS.yellow);
        const boomPin = new THREE.Mesh(
          new THREE.CylinderGeometry(0.14, 0.14, 0.32, 12),
          plastic(COLORS.blue)
        );
        boomPin.rotation.x = Math.PI / 2;
        boomPin.position.set(BOOM_LENGTH, 0, 0);
        boomPivot.add(boomPin);

        const stickPivot = new THREE.Group();
        stickPivot.position.x = BOOM_LENGTH;
        boomPivot.add(stickPivot);
        addBrick(stickPivot, STICK_LENGTH / 2, -0.08, 0, 5, 1, COLORS.yellow);

        const bucketPivot = new THREE.Group();
        bucketPivot.position.x = STICK_LENGTH;
        stickPivot.add(bucketPivot);
        addBrick(bucketPivot, 0.13, -0.18, 0, 2, 2, COLORS.orange);
        addBrick(bucketPivot, 0.28, -0.02, -0.26, 1, 2, COLORS.yellow);
        addBrick(bucketPivot, 0.28, -0.02, 0.26, 1, 2, COLORS.yellow);
        addBrick(bucketPivot, 0.40, -0.18, 0, 1, 2, COLORS.gray);

        addBrick(scene, -0.55, 0, 0, 4, 3, COLORS.grayLight);
        addBrick(scene, -0.55, 0.25, 0, 2, 2, COLORS.red);
        addBrick(scene, -0.55, 0.50, 0, 2, 1, COLORS.blue);
        const pickupBrick = addBrick(
          scene, -0.55, 0.75, 0, 1, 1, COLORS.orange
        );

        addBrick(scene, -0.55, 0, 0.92, 3, 2, COLORS.green);
        addBrick(scene, -0.81, 0.25, 0.92, 1, 1, COLORS.yellow);
        addBrick(scene, -0.55, 0.25, 0.92, 1, 1, COLORS.red);
        addBrick(scene, -0.29, 0.25, 0.92, 1, 1, COLORS.blue);

        const truck = new THREE.Group();
        truck.position.x = TRUCK_START_X;
        scene.add(truck);
        addBrick(truck, 0, 0.34, 0, 6, 3, COLORS.dark);
        addBrick(truck, -0.42, 0.55, 0, 5, 5, COLORS.gray);
        addBrick(truck, -0.42, 0.80, -0.65, 5, 1, COLORS.orange, 2);
        addBrick(truck, -0.42, 0.80, 0.65, 5, 1, COLORS.orange, 2);
        addBrick(truck, -1.07, 0.80, 0, 1, 5, COLORS.orange, 2);
        addBrick(truck, 0.60, 0.53, 0, 2, 3, COLORS.blue, 2);
        addBrick(truck, 0.86, 0.72, 0, 1, 2, COLORS.blueLight);
        addBrick(truck, 0.91, 0.26, 0, 1, 3, COLORS.yellow);

        for (const side of [-1, 1]) {
          makeWheel(truck, -0.72, TRUCK_WHEEL_RADIUS, side * 0.77,
            TRUCK_WHEEL_RADIUS, 0.15, true);
          makeWheel(truck, 0.62, TRUCK_WHEEL_RADIUS, side * 0.77,
            TRUCK_WHEEL_RADIUS, 0.15, true);
        }

        const cargo = brick(1, 1, COLORS.orange);
        cargo.visible = false;
        scene.add(cargo);

        const armPivotWorld = armPivot.getWorldPosition(new THREE.Vector3());
        function solveArm(target) {
          const dx = target.x - armPivotWorld.x;
          const dy = target.y - armPivotWorld.y;
          const rawDistance = Math.hypot(dx, dy);
          const distance = THREE.MathUtils.clamp(
            rawDistance,
            Math.abs(BOOM_LENGTH - STICK_LENGTH) + 0.02,
            BOOM_LENGTH + STICK_LENGTH - 0.02
          );
          const cosine = THREE.MathUtils.clamp(
            (distance * distance - BOOM_LENGTH ** 2 - STICK_LENGTH ** 2)
              / (2 * BOOM_LENGTH * STICK_LENGTH),
            -1,
            1
          );
          const elbowAngle = Math.acos(cosine);
          const shoulderAngle = Math.atan2(dy, dx)
            - Math.atan2(
              STICK_LENGTH * Math.sin(elbowAngle),
              BOOM_LENGTH + STICK_LENGTH * Math.cos(elbowAngle)
            );
          boomPivot.rotation.z = shoulderAngle;
          stickPivot.rotation.z = elbowAngle;
        }

        function ease(value) {
          const t = THREE.MathUtils.clamp(value, 0, 1);
          return t * t * (3 - 2 * t);
        }

        function mixPoint(from, to, amount) {
          return new THREE.Vector3().lerpVectors(from, to, ease(amount));
        }

        function armTarget(time) {
          if (time < 1.6) {
            return mixPoint(REST_TARGET, PICK_TARGET, time / 1.6);
          }
          if (time < 2.6) {
            return PICK_TARGET.clone();
          }
          if (time < 5.0) {
            return mixPoint(PICK_TARGET, DUMP_TARGET, (time - 2.6) / 2.4);
          }
          if (time < 5.65) {
            return DUMP_TARGET.clone();
          }
          if (time < 6.8) {
            return mixPoint(DUMP_TARGET, REST_TARGET, (time - 5.65) / 1.15);
          }
          return REST_TARGET.clone();
        }

        function bucketCurl(time) {
          if (time < 1.6) return 0;
          if (time < 2.1) return 0.65 * ease((time - 1.6) / 0.5);
          if (time < 5.0) return 0.65;
          if (time < 5.65) return THREE.MathUtils.lerp(
            0.65, -0.48, ease((time - 5.0) / 0.65)
          );
          return -0.48;
        }

        const releaseStart = new THREE.Vector3(
          DUMP_TARGET.x + 0.10, DUMP_TARGET.y - 0.02, DUMP_TARGET.z
        );
        const cargoBedPosition = new THREE.Vector3(
          TRUCK_START_X + BED_LOAD_X, BED_LOAD_Y, 0
        );
        const cargoBucketOffset = new THREE.Vector3(0.10, -0.02, 0);

        function update(time) {
          solveArm(armTarget(time));
          bucketPivot.rotation.z = bucketCurl(time);

          const driveProgress = THREE.MathUtils.clamp((time - 7.0) / 2.0, 0, 1);
          const travel = TRUCK_DRIVE_DISTANCE * ease(driveProgress);
          truck.position.x = TRUCK_START_X + travel;
          for (const wheel of truckWheels) {
            wheel.rotation.z = -travel / TRUCK_WHEEL_RADIUS;
          }

          if (time < 2.1) {
            pickupBrick.visible = true;
            cargo.visible = false;
          } else {
            pickupBrick.visible = false;
            cargo.visible = true;
            if (time < 5.2) {
              bucketPivot.updateWorldMatrix(true, false);
              cargo.position.copy(
                bucketPivot.localToWorld(cargoBucketOffset.clone())
              );
            } else if (time < 5.65) {
              cargo.position.lerpVectors(
                releaseStart,
                cargoBedPosition,
                ease((time - 5.2) / 0.45)
              );
            } else {
              cargo.position.set(
                truck.position.x + BED_LOAD_X,
                BED_LOAD_Y,
                0
              );
            }
          }
        }

        function resize() {
          const width = Math.max(1, canvas.clientWidth);
          const height = Math.max(1, canvas.clientHeight);
          renderer.setSize(width, height, false);
          camera.aspect = width / height;
          camera.updateProjectionMatrix();
        }
        new ResizeObserver(resize).observe(canvas);
        resize();

        const startTime = performance.now();
        function animate(now) {
          const time = Math.min((now - startTime) / 1000, DURATION);
          update(time);
          renderer.render(scene, camera);
          if (time < DURATION) {
            requestAnimationFrame(animate);
          }
        }
        requestAnimationFrame(animate);
      } catch (error) {
        console.error("Toy Brick scene initialization failed.", error);
        errorPanel.textContent = `Scene initialization failed: ${error.message}`;
        errorPanel.hidden = false;
      }
    })();
  </script>
</body>
</html>
